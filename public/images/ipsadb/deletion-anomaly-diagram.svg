<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#dc2626"/>
    </marker>
    
    <!-- Strike through pattern -->
    <pattern id="strikePattern" x="0" y="0" width="100%" height="100%">
      <line x1="0" y1="0" x2="100%" y2="100%" stroke="#dc2626" stroke-width="2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1000" height="850" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e293b">Deletion Anomaly in Developer Database</text>
  
  <!-- Problem Statement Box -->
  <rect x="150" y="55" width="700" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="500" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">🚨 Scenario: Maggie leaves the company</text>
  <text x="500" y="100" text-anchor="middle" font-size="14" fill="#7f1d1d">Problem: Deleting Maggie's record also loses information about</text>
  <text x="500" y="105" text-anchor="middle" font-size="14" fill="#7f1d1d">the "Exploding Squirrel" project and JavaScript usage!</text>
  
  <!-- Original Table -->
  <g id="original-table">
    <text x="500" y="145" text-anchor="middle" font-size="20" font-weight="bold" fill="#059669">Original Table</text>
    
    <!-- Table -->
    <rect x="150" y="165" width="700" height="280" fill="white" stroke="#6b7280" stroke-width="2" rx="5" filter="url(#shadow)"/>
    
    <!-- Table Header -->
    <rect x="150" y="165" width="700" height="35" fill="#374151" rx="5 5 0 0"/>
    <text x="500" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="white">DEVELOPER_LANGUAGE_PROJECT Table</text>
    
    <!-- Column Headers -->
    <line x1="150" y1="200" x2="850" y2="200" stroke="#6b7280" stroke-width="2"/>
    <rect x="150" y="200" width="233" height="30" fill="#e5e7eb"/>
    <text x="266" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Developer_Name</text>
    
    <line x1="383" y1="200" x2="383" y2="445" stroke="#d1d5db" stroke-width="1"/>
    <rect x="383" y="200" width="234" height="30" fill="#e5e7eb"/>
    <text x="500" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Language</text>
    
    <line x1="617" y1="200" x2="617" y2="445" stroke="#d1d5db" stroke-width="1"/>
    <rect x="617" y="200" width="233" height="30" fill="#e5e7eb"/>
    <text x="733" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Project_Name</text>
    
    <!-- Data Rows -->
    <line x1="150" y1="230" x2="850" y2="230" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Row 1 - Lisa -->
    <rect x="150" y="230" width="700" height="30" fill="#f9fafb"/>
    <text x="266" y="250" text-anchor="middle" font-size="12" fill="#111827">Lisa</text>
    <text x="500" y="250" text-anchor="middle" font-size="12" fill="#111827">Python</text>
    <text x="733" y="250" text-anchor="middle" font-size="12" fill="#111827">Atomic Blaster</text>
    
    <line x1="150" y1="260" x2="850" y2="260" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Row 2 - Bart -->
    <text x="266" y="280" text-anchor="middle" font-size="12" fill="#111827">Bart</text>
    <text x="500" y="280" text-anchor="middle" font-size="12" fill="#111827">Java</text>
    <text x="733" y="280" text-anchor="middle" font-size="12" fill="#111827">Invisible Tank</text>
    
    <line x1="150" y1="290" x2="850" y2="290" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Row 3 - Montgomery -->
    <rect x="150" y="290" width="700" height="30" fill="#f9fafb"/>
    <text x="266" y="310" text-anchor="middle" font-size="12" fill="#111827">Montgomery</text>
    <text x="500" y="310" text-anchor="middle" font-size="12" fill="#111827">Python</text>
    <text x="733" y="310" text-anchor="middle" font-size="12" fill="#111827">Atomic Blaster</text>
    
    <line x1="150" y1="320" x2="850" y2="320" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Row 4 - Maggie (Highlighted for deletion) -->
    <rect x="150" y="320" width="700" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
    <rect x="150" y="320" width="233" height="30" fill="#fca5a5"/>
    <text x="266" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Maggie</text>
    <rect x="383" y="320" width="234" height="30" fill="#fef3c7"/>
    <text x="500" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">JavaScript</text>
    <rect x="617" y="320" width="233" height="30" fill="#dcfce7"/>
    <text x="733" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Exploding Squirrel</text>
    
    <line x1="150" y1="350" x2="850" y2="350" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Row 5 - Ned -->
    <rect x="150" y="350" width="700" height="30" fill="#f9fafb"/>
    <text x="266" y="370" text-anchor="middle" font-size="12" fill="#111827">Ned</text>
    <text x="500" y="370" text-anchor="middle" font-size="12" fill="#111827">C++</text>
    <text x="733" y="370" text-anchor="middle" font-size="12" fill="#111827">War AI</text>
    
    <line x1="150" y1="380" x2="850" y2="380" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Row 6 - Homer -->
    <text x="266" y="400" text-anchor="middle" font-size="12" fill="#111827">Homer</text>
    <text x="500" y="400" text-anchor="middle" font-size="12" fill="#111827">Python</text>
    <text x="733" y="400" text-anchor="middle" font-size="12" fill="#111827">Atomic Blaster</text>
    
    <line x1="150" y1="410" x2="850" y2="410" stroke="#d1d5db" stroke-width="1"/>
    
    <!-- Row 7 - Marge -->
    <rect x="150" y="410" width="700" height="30" fill="#f9fafb"/>
    <text x="266" y="430" text-anchor="middle" font-size="12" fill="#111827">Marge</text>
    <text x="500" y="430" text-anchor="middle" font-size="12" fill="#111827">Ruby</text>
    <text x="733" y="430" text-anchor="middle" font-size="12" fill="#111827">War AI</text>
  </g>
  
  <!-- Annotation arrows pointing to Maggie's row -->
  <path d="M 100 335 L 145 335" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="95" y="330" text-anchor="end" font-size="12" fill="#dc2626" font-weight="bold">Only developer</text>
  <text x="95" y="345" text-anchor="end" font-size="12" fill="#dc2626" font-weight="bold">to delete</text>
  
  <path d="M 500 370 L 500 355" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="500" y="390" text-anchor="middle" font-size="12" fill="#f59e0b" font-weight="bold">Only JavaScript record!</text>
  
  <path d="M 900 335 L 855 335" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="905" y="330" text-anchor="start" font-size="12" fill="#16a34a" font-weight="bold">Only record of</text>
  <text x="905" y="345" text-anchor="start" font-size="12" fill="#16a34a" font-weight="bold">this project!</text>
  
  <!-- Arrow pointing down -->
  <path d="M 500 460 L 500 500" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="520" y="485" font-size="14" fill="#dc2626" font-weight="bold">Delete Maggie's record...</text>
  
  <!-- After Deletion Table -->
  <g id="after-deletion">
    <text x="500" y="540" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">❌ After Deletion - Lost Information!</text>
    
    <!-- Smaller table showing remaining records -->
    <rect x="200" y="560" width="600" height="150" fill="white" stroke="#dc2626" stroke-width="2" rx="5" filter="url(#shadow)"/>
    
    <!-- Show sample of remaining rows -->
    <rect x="200" y="560" width="600" height="30" fill="#fee2e2"/>
    <text x="500" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Remaining Records (sample)</text>
    
    <line x1="200" y1="590" x2="800" y2="590" stroke="#fca5a5" stroke-width="1"/>
    
    <text x="300" y="610" text-anchor="middle" font-size="12" fill="#111827">Lisa</text>
    <text x="500" y="610" text-anchor="middle" font-size="12" fill="#111827">Python</text>
    <text x="700" y="610" text-anchor="middle" font-size="12" fill="#111827">Atomic Blaster</text>
    
    <line x1="200" y1="620" x2="800" y2="620" stroke="#fca5a5" stroke-width="1"/>
    
    <text x="300" y="640" text-anchor="middle" font-size="12" fill="#111827">Bart</text>
    <text x="500" y="640" text-anchor="middle" font-size="12" fill="#111827">Java</text>
    <text x="700" y="640" text-anchor="middle" font-size="12" fill="#111827">Invisible Tank</text>
    
    <line x1="200" y1="650" x2="800" y2="650" stroke="#fca5a5" stroke-width="1"/>
    
    <text x="500" y="675" text-anchor="middle" font-size="12" fill="#6b7280">... other records ...</text>
    
    <text x="500" y="700" text-anchor="middle" font-size="13" font-style="italic" fill="#dc2626">No JavaScript! No Exploding Squirrel project!</text>
  </g>
  
  <!-- Lost Information Box -->
  <rect x="100" y="730" width="380" height="90" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="290" y="755" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">❌ Lost Forever:</text>
  <text x="120" y="780" font-size="13" fill="#7f1d1d">• JavaScript was used in the company</text>
  <text x="120" y="800" font-size="13" fill="#7f1d1d">• "Exploding Squirrel" project existed</text>
  
  <!-- Explanation Box -->
  <rect x="520" y="730" width="380" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="710" y="755" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">⚠️ Why This Happens:</text>
  <text x="540" y="780" font-size="13" fill="#78350f">• Multiple entities in one table</text>
  <text x="540" y="800" font-size="13" fill="#78350f">• Deleting one entity removes all related data</text>
  
  <!-- Solution Box -->
  <rect x="200" y="830" width="600" height="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="5"/>
  <text x="500" y="842" text-anchor="middle" font-size="12" fill="#14532d">✅ Solution: Normalize into DEVELOPERS, LANGUAGES, PROJECTS, and relationship tables</text>
</svg>