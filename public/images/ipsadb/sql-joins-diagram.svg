<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Pattern for non-selected areas -->
    <pattern id="stripes" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1100" height="900" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e293b">SQL JOINs Visualized</text>
  <text x="550" y="60" text-anchor="middle" font-size="14" fill="#64748b">Understanding different JOIN types with Venn diagrams</text>
  
  <!-- Legend -->
  <rect x="400" y="75" width="300" height="40" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5"/>
  <circle cx="430" cy="95" r="12" fill="#3b82f6" opacity="0.7"/>
  <text x="450" y="100" font-size="12" fill="#334155">Table A</text>
  <circle cx="530" cy="95" r="12" fill="#10b981" opacity="0.7"/>
  <text x="550" y="100" font-size="12" fill="#334155">Table B</text>
  <rect x="620" y="88" width="15" height="15" fill="#8b5cf6"/>
  <text x="640" y="100" font-size="12" fill="#334155">Result</text>
  
  <!-- INNER JOIN -->
  <g id="inner-join">
    <rect x="50" y="140" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="175" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">INNER JOIN</text>
    
    <!-- Venn diagram -->
    <g transform="translate(175, 230)">
      <!-- Left circle (Table A) -->
      <circle cx="-30" cy="0" r="50" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
      <!-- Right circle (Table B) -->
      <circle cx="30" cy="0" r="50" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2"/>
      <!-- Intersection highlight -->
      <path d="M 0,-40 A 50,50 0 0,1 0,40 A 50,50 0 0,1 0,-40" fill="#8b5cf6" opacity="0.8"/>
      
      <!-- Labels -->
      <text x="-50" y="0" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">A</text>
      <text x="50" y="0" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">B</text>
    </g>
    
    <!-- SQL -->
    <rect x="60" y="290" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="175" y="305" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">SELECT * FROM A</text>
    <text x="175" y="320" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">INNER JOIN B ON A.id = B.id</text>
  </g>
  
  <!-- LEFT JOIN -->
  <g id="left-join">
    <rect x="330" y="140" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="455" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">LEFT JOIN</text>
    
    <!-- Venn diagram -->
    <g transform="translate(455, 230)">
      <!-- Left circle (Table A) - fully selected -->
      <circle cx="-30" cy="0" r="50" fill="#8b5cf6" opacity="0.6" stroke="#3b82f6" stroke-width="2"/>
      <!-- Right circle (Table B) -->
      <circle cx="30" cy="0" r="50" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="-50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">A</text>
      <text x="50" y="0" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">B</text>
    </g>
    
    <!-- SQL -->
    <rect x="340" y="290" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="455" y="305" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">SELECT * FROM A</text>
    <text x="455" y="320" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">LEFT JOIN B ON A.id = B.id</text>
  </g>
  
  <!-- RIGHT JOIN -->
  <g id="right-join">
    <rect x="610" y="140" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="735" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">RIGHT JOIN</text>
    
    <!-- Venn diagram -->
    <g transform="translate(735, 230)">
      <!-- Left circle (Table A) -->
      <circle cx="-30" cy="0" r="50" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
      <!-- Right circle (Table B) - fully selected -->
      <circle cx="30" cy="0" r="50" fill="#8b5cf6" opacity="0.6" stroke="#10b981" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="-50" y="0" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">A</text>
      <text x="50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">B</text>
    </g>
    
    <!-- SQL -->
    <rect x="620" y="290" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="735" y="305" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">SELECT * FROM A</text>
    <text x="735" y="320" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">RIGHT JOIN B ON A.id = B.id</text>
  </g>
  
  <!-- FULL OUTER JOIN -->
  <g id="full-outer-join">
    <rect x="50" y="360" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="175" y="385" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">FULL OUTER JOIN</text>
    
    <!-- Venn diagram -->
    <g transform="translate(175, 450)">
      <!-- Both circles fully selected -->
      <circle cx="-30" cy="0" r="50" fill="#8b5cf6" opacity="0.5" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="30" cy="0" r="50" fill="#8b5cf6" opacity="0.5" stroke="#10b981" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="-50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">A</text>
      <text x="50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">B</text>
    </g>
    
    <!-- SQL -->
    <rect x="60" y="510" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="175" y="525" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">SELECT * FROM A</text>
    <text x="175" y="540" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">FULL OUTER JOIN B ON A.id = B.id</text>
  </g>
  
  <!-- LEFT EXCLUDING JOIN -->
  <g id="left-excluding-join">
    <rect x="330" y="360" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="455" y="385" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">LEFT EXCLUDING JOIN</text>
    
    <!-- Venn diagram -->
    <g transform="translate(455, 450)">
      <!-- Left circle (Table A) -->
      <circle cx="-30" cy="0" r="50" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
      <!-- Right circle (Table B) -->
      <circle cx="30" cy="0" r="50" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2"/>
      <!-- Highlight only left exclusive part -->
      <path d="M -80,0 A 50,50 0 1,1 -30,-50 A 50,50 0 0,0 -30,50 A 50,50 0 1,1 -80,0" fill="#8b5cf6" opacity="0.8"/>
      
      <!-- Labels -->
      <text x="-50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">A</text>
      <text x="50" y="0" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">B</text>
    </g>
    
    <!-- SQL -->
    <rect x="340" y="510" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="455" y="525" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">SELECT * FROM A LEFT JOIN B</text>
    <text x="455" y="540" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">ON A.id = B.id WHERE B.id IS NULL</text>
  </g>
  
  <!-- RIGHT EXCLUDING JOIN -->
  <g id="right-excluding-join">
    <rect x="610" y="360" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="735" y="385" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">RIGHT EXCLUDING JOIN</text>
    
    <!-- Venn diagram -->
    <g transform="translate(735, 450)">
      <!-- Left circle (Table A) -->
      <circle cx="-30" cy="0" r="50" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
      <!-- Right circle (Table B) -->
      <circle cx="30" cy="0" r="50" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2"/>
      <!-- Highlight only right exclusive part -->
      <path d="M 80,0 A 50,50 0 1,0 30,-50 A 50,50 0 0,1 30,50 A 50,50 0 1,0 80,0" fill="#8b5cf6" opacity="0.8"/>
      
      <!-- Labels -->
      <text x="-50" y="0" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">A</text>
      <text x="50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">B</text>
    </g>
    
    <!-- SQL -->
    <rect x="620" y="510" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="735" y="525" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">SELECT * FROM A RIGHT JOIN B</text>
    <text x="735" y="540" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">ON A.id = B.id WHERE A.id IS NULL</text>
  </g>
  
  <!-- FULL OUTER EXCLUDING JOIN -->
  <g id="full-outer-excluding-join">
    <rect x="190" y="580" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="315" y="605" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">OUTER EXCLUDING JOIN</text>
    
    <!-- Venn diagram -->
    <g transform="translate(315, 670)">
      <!-- Left circle (Table A) -->
      <circle cx="-30" cy="0" r="50" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
      <!-- Right circle (Table B) -->
      <circle cx="30" cy="0" r="50" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2"/>
      <!-- Highlight only exclusive parts (no intersection) -->
      <path d="M -80,0 A 50,50 0 1,1 -30,-50 A 50,50 0 0,0 -30,50 A 50,50 0 1,1 -80,0" fill="#8b5cf6" opacity="0.8"/>
      <path d="M 80,0 A 50,50 0 1,0 30,-50 A 50,50 0 0,1 30,50 A 50,50 0 1,0 80,0" fill="#8b5cf6" opacity="0.8"/>
      
      <!-- Labels -->
      <text x="-50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">A</text>
      <text x="50" y="0" text-anchor="middle" font-size="12" fill="white" font-weight="bold">B</text>
    </g>
    
    <!-- SQL -->
    <rect x="200" y="730" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="315" y="743" text-anchor="middle" font-size="9" fill="#334155" font-family="monospace">SELECT * FROM A FULL OUTER JOIN B</text>
    <text x="315" y="757" text-anchor="middle" font-size="9" fill="#334155" font-family="monospace">ON A.id=B.id WHERE A.id IS NULL OR B.id IS NULL</text>
  </g>
  
  <!-- CROSS JOIN -->
  <g id="cross-join">
    <rect x="470" y="580" width="250" height="200" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="595" y="605" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">CROSS JOIN</text>
    <text x="595" y="625" text-anchor="middle" font-size="11" fill="#64748b">(Cartesian Product)</text>
    
    <!-- Visual representation -->
    <g transform="translate(595, 670)">
      <!-- Grid showing cartesian product -->
      <rect x="-60" y="-40" width="120" height="80" fill="none" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Rows and columns -->
      <line x1="-60" y1="-20" x2="60" y2="-20" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="-60" y1="20" x2="60" y2="20" stroke="#cbd5e1" stroke-width="1"/>
      
      <line x1="-20" y1="-40" x2="-20" y2="40" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="20" y1="-40" x2="20" y2="40" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Fill all cells -->
      <rect x="-60" y="-40" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-20" y="-40" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="20" y="-40" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-60" y="-20" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-20" y="-20" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="20" y="-20" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-60" y="0" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-20" y="0" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="20" y="0" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-60" y="20" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-20" y="20" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      <rect x="20" y="20" width="40" height="20" fill="#8b5cf6" opacity="0.3"/>
      
      <!-- Labels -->
      <text x="-80" y="0" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="bold">A</text>
      <text x="0" y="-55" text-anchor="middle" font-size="12" fill="#10b981" font-weight="bold">B</text>
      
      <text x="0" y="60" text-anchor="middle" font-size="10" fill="#64748b">A × B</text>
    </g>
    
    <!-- SQL -->
    <rect x="480" y="730" width="230" height="40" fill="#f1f5f9" rx="5"/>
    <text x="595" y="745" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">SELECT * FROM A</text>
    <text x="595" y="760" text-anchor="middle" font-size="10" fill="#334155" font-family="monospace">CROSS JOIN B</text>
  </g>
  
  <!-- Sample tables -->
  <g id="sample-tables">
    <rect x="880" y="140" width="200" height="640" fill="white" stroke="#e5e7eb" stroke-width="1" rx="8" filter="url(#shadow)"/>
    <text x="980" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Sample Tables</text>
    
    <!-- Table A -->
    <text x="980" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b82f6">Table A</text>
    <rect x="900" y="205" width="160" height="120" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1" rx="5"/>
    <text x="930" y="225" font-size="11" font-weight="bold" fill="#1e40af">ID | Name</text>
    <line x1="900" y1="230" x2="1060" y2="230" stroke="#3b82f6" stroke-width="1"/>
    <text x="930" y="250" font-size="11" fill="#334155">1  | Alice</text>
    <text x="930" y="270" font-size="11" fill="#334155">2  | Bob</text>
    <text x="930" y="290" font-size="11" fill="#334155">3  | Carol</text>
    <text x="930" y="310" font-size="11" fill="#334155">4  | Dave</text>
    
    <!-- Table B -->
    <text x="980" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#10b981">Table B</text>
    <rect x="900" y="365" width="160" height="120" fill="#f0fdf4" stroke="#10b981" stroke-width="1" rx="5"/>
    <text x="930" y="385" font-size="11" font-weight="bold" fill="#047857">ID | Department</text>
    <line x1="900" y1="390" x2="1060" y2="390" stroke="#10b981" stroke-width="1"/>
    <text x="930" y="410" font-size="11" fill="#334155">2  | Sales</text>
    <text x="930" y="430" font-size="11" fill="#334155">3  | Marketing</text>
    <text x="930" y="450" font-size="11" fill="#334155">5  | IT</text>
    <text x="930" y="470" font-size="11" fill="#334155">6  | HR</text>
    
    <!-- Results summary -->
    <rect x="900" y="505" width="160" height="255" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1" rx="5"/>
    <text x="980" y="525" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">Result Counts</text>
    <line x1="900" y1="530" x2="1060" y2="530" stroke="#8b5cf6" stroke-width="1"/>
    
    <text x="910" y="550" font-size="10" fill="#334155">INNER: 2 rows (2,3)</text>
    <text x="910" y="570" font-size="10" fill="#334155">LEFT: 4 rows (1,2,3,4)</text>
    <text x="910" y="590" font-size="10" fill="#334155">RIGHT: 4 rows (2,3,5,6)</text>
    <text x="910" y="610" font-size="10" fill="#334155">FULL: 6 rows (1,2,3,4,5,6)</text>
    <text x="910" y="630" font-size="10" fill="#334155">LEFT EXCL: 2 rows (1,4)</text>
    <text x="910" y="650" font-size="10" fill="#334155">RIGHT EXCL: 2 rows (5,6)</text>
    <text x="910" y="670" font-size="10" fill="#334155">OUTER EXCL: 4 rows (1,4,5,6)</text>
    <text x="910" y="690" font-size="10" fill="#334155">CROSS: 16 rows (4×4)</text>
  </g>
  
  <!-- Footer note -->
  <rect x="200" y="810" width="700" height="60" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1" rx="8"/>
  <text x="550" y="835" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">💡 Quick Tips:</text>
  <text x="550" y="855" text-anchor="middle" font-size="11" fill="#334155">• INNER JOIN = Only matching records | LEFT JOIN = All from left table | RIGHT JOIN = All from right table</text>
</svg>