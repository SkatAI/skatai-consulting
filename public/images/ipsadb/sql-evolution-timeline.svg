<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Gradient for timeline -->
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1400" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">SQL Language Evolution Timeline</text>
  
  <!-- Main Timeline -->
  <rect x="50" y="390" width="1300" height="8" fill="url(#timelineGradient)" rx="4"/>
  
  <!-- Timeline endpoints -->
  <circle cx="50" cy="394" r="8" fill="#2c3e50"/>
  <circle cx="1350" cy="394" r="8" fill="#9b59b6"/>
  
  <!-- Early 1970s -->
  <g id="1970s">
    <line x1="100" y1="394" x2="100" y2="380" stroke="#2c3e50" stroke-width="3"/>
    <circle cx="100" cy="394" r="6" fill="#e74c3c"/>
    <rect x="40" y="340" width="120" height="35" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="100" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Early 1970s</text>
    
    <!-- Features above -->
    <rect x="30" y="100" width="140" height="220" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="100" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">SEQUEL/SQL Birth</text>
    <text x="40" y="150" font-size="11" fill="#555">• IBM System R</text>
    <text x="40" y="170" font-size="11" fill="#555">• SEQUEL language</text>
    <text x="40" y="190" font-size="11" fill="#555">• Relational model</text>
    <text x="40" y="210" font-size="11" fill="#555">• Basic queries</text>
    <text x="40" y="230" font-size="11" fill="#555">• Set operations</text>
  </g>
  
  <!-- 1982 -->
  <g id="1982">
    <line x1="220" y1="394" x2="220" y2="420" stroke="#2c3e50" stroke-width="3"/>
    <circle cx="220" cy="394" r="6" fill="#e74c3c"/>
    <rect x="180" y="425" width="80" height="35" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="220" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">1982</text>
    
    <!-- Features below -->
    <rect x="160" y="480" width="120" height="100" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="220" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">SQL/DS</text>
    <text x="170" y="530" font-size="11" fill="#555">• First commercial</text>
    <text x="170" y="550" font-size="11" fill="#555">  SQL system</text>
    <text x="170" y="570" font-size="11" fill="#555">• IBM release</text>
  </g>
  
  <!-- SQL-86/87 -->
  <g id="sql86">
    <line x1="340" y1="394" x2="340" y2="380" stroke="#2c3e50" stroke-width="3"/>
    <circle cx="340" cy="394" r="6" fill="#e74c3c"/>
    <rect x="290" y="340" width="100" height="35" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="340" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">SQL-86/87</text>
    
    <!-- Features above -->
    <rect x="280" y="100" width="120" height="220" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="340" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">First ANSI</text>
    <text x="290" y="150" font-size="11" fill="#555">• SELECT, INSERT</text>
    <text x="290" y="170" font-size="11" fill="#555">• UPDATE, DELETE</text>
    <text x="290" y="190" font-size="11" fill="#555">• Simple JOIN</text>
    <text x="290" y="210" font-size="11" fill="#555">• Basic data types</text>
    <text x="290" y="230" font-size="11" fill="#555">• DDL commands</text>
  </g>
  
  <!-- SQL-89 -->
  <g id="sql89">
    <line x1="440" y1="394" x2="440" y2="420" stroke="#2c3e50" stroke-width="3"/>
    <circle cx="440" cy="394" r="6" fill="#e74c3c"/>
    <rect x="400" y="425" width="80" height="35" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="440" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">SQL-89</text>
    
    <!-- Features below -->
    <rect x="380" y="480" width="120" height="120" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="440" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">SQL1</text>
    <text x="390" y="530" font-size="11" fill="#555">• PRIMARY KEY</text>
    <text x="390" y="550" font-size="11" fill="#555">• FOREIGN KEY</text>
    <text x="390" y="570" font-size="11" fill="#555">• Referential</text>
    <text x="390" y="590" font-size="11" fill="#555">  integrity</text>
  </g>
  
  <!-- SQL-92 -->
  <g id="sql92">
    <line x1="540" y1="394" x2="540" y2="380" stroke="#2c3e50" stroke-width="3"/>
    <circle cx="540" cy="394" r="6" fill="#e74c3c"/>
    <rect x="500" y="340" width="80" height="35" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="540" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">SQL-92</text>
    
    <!-- Features above -->
    <rect x="480" y="100" width="120" height="220" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="540" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">SQL2</text>
    <text x="490" y="150" font-size="11" fill="#555">• DATE, TIME</text>
    <text x="490" y="170" font-size="11" fill="#555">• Outer JOINs</text>
    <text x="490" y="190" font-size="11" fill="#555">• CASE expressions</text>
    <text x="490" y="210" font-size="11" fill="#555">• CAST function</text>
    <text x="490" y="230" font-size="11" fill="#555">• Dynamic SQL</text>
    <text x="490" y="250" font-size="11" fill="#555">• Schemas</text>
  </g>
  
  <!-- SQL:1999 -->
  <g id="sql1999">
    <line x1="660" y1="394" x2="660" y2="420" stroke="#3498db" stroke-width="3"/>
    <circle cx="660" cy="394" r="6" fill="#e74c3c"/>
    <rect x="610" y="425" width="100" height="35" fill="#fff" stroke="#3498db" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="660" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#3498db">SQL:1999</text>
    
    <!-- Features below -->
    <rect x="590" y="480" width="140" height="180" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="660" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498db">SQL3</text>
    <text x="600" y="530" font-size="11" fill="#555">• Regular expressions</text>
    <text x="600" y="550" font-size="11" fill="#555">• Object-oriented</text>
    <text x="600" y="570" font-size="11" fill="#555">• Arrays</text>
    <text x="600" y="590" font-size="11" fill="#555">• Window functions</text>
    <text x="600" y="610" font-size="11" fill="#555">• CTEs (WITH)</text>
    <text x="600" y="630" font-size="11" fill="#555">• User-defined types</text>
  </g>
  
  <!-- SQL:2003 -->
  <g id="sql2003">
    <line x1="780" y1="394" x2="780" y2="380" stroke="#3498db" stroke-width="3"/>
    <circle cx="780" cy="394" r="6" fill="#e74c3c"/>
    <rect x="730" y="340" width="100" height="35" fill="#fff" stroke="#3498db" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="780" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#3498db">SQL:2003</text>
    
    <!-- Features above -->
    <rect x="720" y="100" width="120" height="220" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="780" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498db">XML Era</text>
    <text x="730" y="150" font-size="11" fill="#555">• XML data type</text>
    <text x="730" y="170" font-size="11" fill="#555">• MERGE statement</text>
    <text x="730" y="190" font-size="11" fill="#555">• IDENTITY</text>
    <text x="730" y="210" font-size="11" fill="#555">• Sequences</text>
    <text x="730" y="230" font-size="11" fill="#555">• Standard window</text>
    <text x="730" y="250" font-size="11" fill="#555">  functions</text>
  </g>
  
  <!-- SQL:2006 -->
  <g id="sql2006">
    <line x1="880" y1="394" x2="880" y2="420" stroke="#3498db" stroke-width="3"/>
    <circle cx="880" cy="394" r="6" fill="#e74c3c"/>
    <rect x="830" y="425" width="100" height="35" fill="#fff" stroke="#3498db" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="880" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#3498db">SQL:2006</text>
    
    <!-- Features below -->
    <rect x="820" y="480" width="120" height="100" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="880" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498db">XML++</text>
    <text x="830" y="530" font-size="11" fill="#555">• XQuery support</text>
    <text x="830" y="550" font-size="11" fill="#555">• XML methods</text>
    <text x="830" y="570" font-size="11" fill="#555">• XML storage</text>
  </g>
  
  <!-- SQL:2011 -->
  <g id="sql2011">
    <line x1="1000" y1="394" x2="1000" y2="380" stroke="#9b59b6" stroke-width="3"/>
    <circle cx="1000" cy="394" r="6" fill="#e74c3c"/>
    <rect x="950" y="340" width="100" height="35" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="1000" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#9b59b6">SQL:2011</text>
    
    <!-- Features above -->
    <rect x="940" y="100" width="120" height="220" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="1000" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#9b59b6">Temporal</text>
    <text x="950" y="150" font-size="11" fill="#555">• System-versioned</text>
    <text x="950" y="170" font-size="11" fill="#555">  tables</text>
    <text x="950" y="190" font-size="11" fill="#555">• Temporal queries</text>
    <text x="950" y="210" font-size="11" fill="#555">• Enhanced windows</text>
    <text x="950" y="230" font-size="11" fill="#555">• Better CTEs</text>
  </g>
  
  <!-- SQL:2016 -->
  <g id="sql2016">
    <line x1="1120" y1="394" x2="1120" y2="420" stroke="#9b59b6" stroke-width="3"/>
    <circle cx="1120" cy="394" r="6" fill="#e74c3c"/>
    <rect x="1070" y="425" width="100" height="35" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="1120" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#9b59b6">SQL:2016</text>
    
    <!-- Features below -->
    <rect x="1060" y="480" width="120" height="120" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="1120" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#9b59b6">JSON Era</text>
    <text x="1070" y="530" font-size="11" fill="#555">• JSON support</text>
    <text x="1070" y="550" font-size="11" fill="#555">• JSON functions</text>
    <text x="1070" y="570" font-size="11" fill="#555">• Row pattern</text>
    <text x="1070" y="590" font-size="11" fill="#555">  recognition</text>
  </g>
  
  <!-- SQL:2023 -->
  <g id="sql2023">
    <line x1="1250" y1="394" x2="1250" y2="380" stroke="#9b59b6" stroke-width="3"/>
    <circle cx="1250" cy="394" r="6" fill="#e74c3c"/>
    <rect x="1200" y="340" width="100" height="35" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="1250" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#9b59b6">SQL:2023</text>
    
    <!-- Features above -->
    <rect x="1180" y="100" width="140" height="220" fill="white" stroke="#e0e0e0" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="1250" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#9b59b6">Graph Era</text>
    <text x="1190" y="150" font-size="11" fill="#555">• Property graphs</text>
    <text x="1190" y="170" font-size="11" fill="#555">• SQL/PGQ</text>
    <text x="1190" y="190" font-size="11" fill="#555">• Multi-dim arrays</text>
    <text x="1190" y="210" font-size="11" fill="#555">• More JSON</text>
    <text x="1190" y="230" font-size="11" fill="#555">• Graph queries</text>
  </g>
  
  <!-- Era labels -->
  <text x="200" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50" opacity="0.3">Foundation Era</text>
  <text x="540" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db" opacity="0.3">Standardization Era</text>
  <text x="880" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db" opacity="0.3">Object/XML Era</text>
  <text x="1150" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#9b59b6" opacity="0.3">Modern Era</text>
</svg>