<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="engineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="heapGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="btreeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hashGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#1d4ed8"/>
    </marker>
    
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#6b7280"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="900" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e293b">Storage Engine: Data Access Methods</text>
  
  <!-- SQL Query Input -->
  <rect x="300" y="60" width="300" height="50" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="450" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">SQL Query</text>
  <text x="450" y="102" text-anchor="middle" font-size="12" fill="#075985">SELECT * FROM users WHERE id = 5</text>
  
  <!-- Arrow down -->
  <path d="M 450 110 L 450 140" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  
  <!-- Main Storage Engine Box -->
  <rect x="200" y="150" width="500" height="120" fill="url(#engineGradient)" rx="10" filter="url(#shadow)"/>
  <text x="450" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="white">Storage Engine</text>
  <text x="450" y="205" text-anchor="middle" font-size="14" fill="#dbeafe">Translates logical operations to physical disk access</text>
  
  <!-- Core Functions -->
  <rect x="220" y="220" width="460" height="40" fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="240" y="245" font-size="12" fill="white">• Read/Write Pages  • Manage Buffers  • Choose Access Path  • Handle Concurrency</text>
  
  <!-- Arrows to storage structures -->
  <path d="M 300 270 L 250 330" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 450 270 L 450 330" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 600 270 L 650 330" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  
  <!-- Storage Structures Section -->
  <text x="450" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">Storage Structures</text>
  
  <!-- Heap Files -->
  <g id="heap-files">
    <rect x="80" y="340" width="200" height="150" fill="url(#heapGradient)" rx="8" filter="url(#shadow)"/>
    <text x="180" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Heap Files</text>
    <text x="180" y="385" text-anchor="middle" font-size="11" fill="#d1fae5">(Unsorted Storage)</text>
    
    <!-- Visual representation of heap -->
    <rect x="100" y="400" width="160" height="20" fill="rgba(255,255,255,0.3)" rx="3"/>
    <rect x="105" y="403" width="25" height="14" fill="#065f46"/>
    <rect x="135" y="403" width="25" height="14" fill="#065f46"/>
    <rect x="165" y="403" width="25" height="14" fill="#065f46"/>
    <rect x="195" y="403" width="25" height="14" fill="#065f46"/>
    <rect x="225" y="403" width="25" height="14" fill="#065f46"/>
    
    <text x="180" y="445" text-anchor="middle" font-size="11" fill="white">• Simple structure</text>
    <text x="180" y="460" text-anchor="middle" font-size="11" fill="white">• Fast inserts</text>
    <text x="180" y="475" text-anchor="middle" font-size="11" fill="white">• Full table scans</text>
  </g>
  
  <!-- B-Tree Index -->
  <g id="btree">
    <rect x="350" y="340" width="200" height="150" fill="url(#btreeGradient)" rx="8" filter="url(#shadow)"/>
    <text x="450" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="white">B-Tree Index</text>
    <text x="450" y="385" text-anchor="middle" font-size="11" fill="#fef3c7">(Sorted Structure)</text>
    
    <!-- Simple B-tree visualization -->
    <g id="btree-visual">
      <!-- Root -->
      <rect x="430" y="395" width="40" height="15" fill="rgba(255,255,255,0.3)" rx="2"/>
      <text x="450" y="406" text-anchor="middle" font-size="10" fill="#78350f">50</text>
      
      <!-- Level 2 -->
      <line x1="430" y1="410" x2="400" y2="420" stroke="white" stroke-width="1"/>
      <line x1="470" y1="410" x2="500" y2="420" stroke="white" stroke-width="1"/>
      
      <rect x="380" y="420" width="40" height="15" fill="rgba(255,255,255,0.3)" rx="2"/>
      <text x="400" y="431" text-anchor="middle" font-size="10" fill="#78350f">25</text>
      
      <rect x="480" y="420" width="40" height="15" fill="rgba(255,255,255,0.3)" rx="2"/>
      <text x="500" y="431" text-anchor="middle" font-size="10" fill="#78350f">75</text>
    </g>
    
    <text x="450" y="455" text-anchor="middle" font-size="11" fill="white">• Fast lookups O(log n)</text>
    <text x="450" y="470" text-anchor="middle" font-size="11" fill="white">• Range queries</text>
    <text x="450" y="485" text-anchor="middle" font-size="11" fill="white">• Sorted access</text>
  </g>
  
  <!-- Hash Index -->
  <g id="hash">
    <rect x="620" y="340" width="200" height="150" fill="url(#hashGradient)" rx="8" filter="url(#shadow)"/>
    <text x="720" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Hash Index</text>
    <text x="720" y="385" text-anchor="middle" font-size="11" fill="#ede9fe">(Direct Access)</text>
    
    <!-- Hash table visualization -->
    <g id="hash-visual">
      <rect x="650" y="400" width="30" height="35" fill="rgba(255,255,255,0.2)" rx="2"/>
      <rect x="690" y="400" width="30" height="35" fill="rgba(255,255,255,0.2)" rx="2"/>
      <rect x="730" y="400" width="30" height="35" fill="rgba(255,255,255,0.2)" rx="2"/>
      <rect x="770" y="400" width="30" height="35" fill="rgba(255,255,255,0.2)" rx="2"/>
      
      <text x="665" y="420" text-anchor="middle" font-size="9" fill="white">0</text>
      <text x="705" y="420" text-anchor="middle" font-size="9" fill="white">1</text>
      <text x="745" y="420" text-anchor="middle" font-size="9" fill="white">2</text>
      <text x="785" y="420" text-anchor="middle" font-size="9" fill="white">3</text>
    </g>
    
    <text x="720" y="455" text-anchor="middle" font-size="11" fill="white">• O(1) point queries</text>
    <text x="720" y="470" text-anchor="middle" font-size="11" fill="white">• No range support</text>
    <text x="720" y="485" text-anchor="middle" font-size="11" fill="white">• Fast equality checks</text>
  </g>
  
  <!-- Arrows to disk -->
  <path d="M 180 490 L 180 530" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 450 490 L 450 530" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 720 490 L 720 530" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  
  <!-- Physical Disk Storage -->
  <rect x="100" y="540" width="700" height="100" fill="#1f2937" rx="8" filter="url(#shadow)"/>
  <text x="450" y="565" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Physical Disk Storage</text>
  
  <!-- Disk pages visualization -->
  <g id="disk-pages">
    <rect x="150" y="580" width="60" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="3"/>
    <text x="180" y="595" text-anchor="middle" font-size="10" fill="#9ca3af">Page 1</text>
    <text x="180" y="610" text-anchor="middle" font-size="8" fill="#6b7280">8KB</text>
    
    <rect x="230" y="580" width="60" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="3"/>
    <text x="260" y="595" text-anchor="middle" font-size="10" fill="#9ca3af">Page 2</text>
    <text x="260" y="610" text-anchor="middle" font-size="8" fill="#6b7280">8KB</text>
    
    <rect x="310" y="580" width="60" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="3"/>
    <text x="340" y="595" text-anchor="middle" font-size="10" fill="#9ca3af">Page 3</text>
    <text x="340" y="610" text-anchor="middle" font-size="8" fill="#6b7280">8KB</text>
    
    <text x="400" y="600" text-anchor="middle" font-size="12" fill="#6b7280">...</text>
    
    <rect x="450" y="580" width="60" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="3"/>
    <text x="480" y="595" text-anchor="middle" font-size="10" fill="#9ca3af">Page N</text>
    <text x="480" y="610" text-anchor="middle" font-size="8" fill="#6b7280">8KB</text>
    
    <rect x="530" y="580" width="60" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="3"/>
    <text x="560" y="600" text-anchor="middle" font-size="10" fill="#9ca3af">Index</text>
    
    <rect x="610" y="580" width="60" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="3"/>
    <text x="640" y="600" text-anchor="middle" font-size="10" fill="#9ca3af">Data</text>
    
    <rect x="690" y="580" width="60" height="40" fill="#374151" stroke="#6b7280" stroke-width="1" rx="3"/>
    <text x="720" y="600" text-anchor="middle" font-size="10" fill="#9ca3af">Meta</text>
  </g>
  
  <!-- Key concepts box -->
  <rect x="200" y="655" width="500" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="450" y="674" text-anchor="middle" font-size="12" fill="#92400e">💡 Storage Engine optimizes between memory (fast) and disk (persistent) access patterns</text>
</svg>