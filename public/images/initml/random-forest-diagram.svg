<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .small-label { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #666; }
      .tiny-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #666; }
      .data-row { font-family: monospace; font-size: 10px; }
      .tree-node { fill: #e8f4f8; stroke: #2196F3; stroke-width: 2; }
      .tree-leaf-a { fill: #e8f5e9; stroke: #4CAF50; stroke-width: 2; }
      .tree-leaf-b { fill: #ffebee; stroke: #f44336; stroke-width: 2; }
      .bootstrap-box { fill: #f5f5f5; stroke: #666; stroke-width: 1; stroke-dasharray: 3,3; }
      .vote-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; }
      .final-box { fill: #e8f5e9; stroke: #4CAF50; stroke-width: 3; }
    </style>
    
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9800"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" class="title">Random Forest : Ensemble d'Arbres de Décision</text>

  <!-- Step 1: Original Dataset -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="160" height="120" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="80" y="20" class="subtitle">Dataset Original</text>
    <text x="80" y="40" class="small-label">1000 samples</text>
    <text x="80" y="55" class="small-label">20 features</text>
    
    <!-- Mini data representation -->
    <rect x="20" y="65" width="120" height="50" fill="white" stroke="#999" stroke-width="1"/>
    <text x="25" y="80" class="data-row">ID  F1  F2 ... F20  Y</text>
    <text x="25" y="92" class="data-row">1   5.2 1.3     2   A</text>
    <text x="25" y="104" class="data-row">2   3.1 4.5     7   B</text>
    <text x="80" y="110" class="data-row">...</text>
  </g>

  <!-- Bootstrap Sampling Arrow -->
  <path d="M 210 130 Q 280 130 350 160" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="125" class="label">Bootstrap</text>
  <text x="280" y="140" class="small-label">Sampling</text>

  <!-- Step 2: Bootstrap Samples -->
  <g transform="translate(250, 180)">
    <!-- Sample 1 -->
    <rect x="0" y="0" width="115" height="85" rx="3" class="bootstrap-box"/>
    <text x="57" y="15" class="small-label" font-weight="bold">Bootstrap 1</text>
    <text x="57" y="30" class="tiny-label">√p features</text>
    <rect x="10" y="37" width="95" height="38" fill="white" stroke="#ccc" stroke-width="1"/>
    <text x="15" y="50" class="data-row">1,1,3,5,7...</text>
    <text x="15" y="62" class="data-row">Feat: 2,7,15</text>
    
    <!-- Sample 2 -->
    <rect x="125" y="0" width="115" height="85" rx="3" class="bootstrap-box"/>
    <text x="182" y="15" class="small-label" font-weight="bold">Bootstrap 2</text>
    <text x="182" y="30" class="tiny-label">√p features</text>
    <rect x="135" y="37" width="95" height="38" fill="white" stroke="#ccc" stroke-width="1"/>
    <text x="140" y="50" class="data-row">2,2,4,6,8...</text>
    <text x="140" y="62" class="data-row">Feat: 1,5,19</text>
    
    <!-- Sample 3 -->
    <rect x="250" y="0" width="115" height="85" rx="3" class="bootstrap-box"/>
    <text x="307" y="15" class="small-label" font-weight="bold">Bootstrap 3</text>
    <text x="307" y="30" class="tiny-label">√p features</text>
    <rect x="260" y="37" width="95" height="38" fill="white" stroke="#ccc" stroke-width="1"/>
    <text x="265" y="50" class="data-row">1,3,3,7,9...</text>
    <text x="265" y="62" class="data-row">Feat: 3,8,11</text>
    
    <!-- ... dots -->
    <text x="380" y="42" class="label" font-size="24">...</text>
    
    <!-- Sample N -->
    <rect x="405" y="0" width="115" height="85" rx="3" class="bootstrap-box"/>
    <text x="462" y="15" class="small-label" font-weight="bold">Bootstrap N</text>
    <text x="462" y="30" class="tiny-label">√p features</text>
    <rect x="415" y="37" width="95" height="38" fill="white" stroke="#ccc" stroke-width="1"/>
    <text x="420" y="50" class="data-row">2,4,5,5,8...</text>
    <text x="420" y="62" class="data-row">Feat: 4,9,16</text>
  </g>

  <!-- Arrows to Trees -->
  <path d="M 307 265 L 307 300" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 432 265 L 432 300" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 557 265 L 557 300" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 712 265 L 712 300" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: Decision Trees -->
  <g transform="translate(250, 310)">
    <text x="260" y="-5" class="subtitle">Arbres de Décision (non contraints)</text>
    
    <!-- Tree 1 -->
    <g transform="translate(0, 10)">
      <!-- Root -->
      <rect x="27" y="0" width="60" height="25" rx="3" class="tree-node"/>
      <text x="57" y="16" class="tiny-label">F2 > 3.5?</text>
      
      <!-- Branches -->
      <line x1="42" y1="25" x2="27" y2="45" stroke="#333" stroke-width="1.5"/>
      <line x1="72" y1="25" x2="87" y2="45" stroke="#333" stroke-width="1.5"/>
      
      <!-- Level 2 -->
      <rect x="7" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="27" y="57" class="tiny-label">F7 > 2?</text>
      
      <rect x="67" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="87" y="57" class="tiny-label">F15 < 5?</text>
      
      <!-- Leaves -->
      <line x1="17" y1="65" x2="12" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="37" y1="65" x2="42" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="77" y1="65" x2="72" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="97" y1="65" x2="102" y2="80" stroke="#333" stroke-width="1"/>
      
      <rect x="2" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="12" y="90" class="tiny-label">A</text>
      
      <rect x="32" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="42" y="90" class="tiny-label">B</text>
      
      <rect x="62" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="72" y="90" class="tiny-label">A</text>
      
      <rect x="92" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="102" y="90" class="tiny-label">B</text>
      
      <text x="57" y="115" class="label" font-weight="bold">Tree 1</text>
    </g>
    
    <!-- Tree 2 -->
    <g transform="translate(125, 10)">
      <!-- Simplified tree structure -->
      <rect x="27" y="0" width="60" height="25" rx="3" class="tree-node"/>
      <text x="57" y="16" class="tiny-label">F1 > 4.2?</text>
      
      <line x1="42" y1="25" x2="27" y2="45" stroke="#333" stroke-width="1.5"/>
      <line x1="72" y1="25" x2="87" y2="45" stroke="#333" stroke-width="1.5"/>
      
      <rect x="7" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="27" y="57" class="tiny-label">F5 < 1?</text>
      
      <rect x="67" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="87" y="57" class="tiny-label">F19 > 8?</text>
      
      <line x1="17" y1="65" x2="12" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="37" y1="65" x2="42" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="77" y1="65" x2="72" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="97" y1="65" x2="102" y2="80" stroke="#333" stroke-width="1"/>
      
      <rect x="2" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="12" y="90" class="tiny-label">B</text>
      
      <rect x="32" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="42" y="90" class="tiny-label">A</text>
      
      <rect x="62" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="72" y="90" class="tiny-label">B</text>
      
      <rect x="92" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="102" y="90" class="tiny-label">A</text>
      
      <text x="57" y="115" class="label" font-weight="bold">Tree 2</text>
    </g>
    
    <!-- Tree 3 -->
    <g transform="translate(250, 10)">
      <rect x="27" y="0" width="60" height="25" rx="3" class="tree-node"/>
      <text x="57" y="16" class="tiny-label">F3 > 6.1?</text>
      
      <line x1="42" y1="25" x2="27" y2="45" stroke="#333" stroke-width="1.5"/>
      <line x1="72" y1="25" x2="87" y2="45" stroke="#333" stroke-width="1.5"/>
      
      <rect x="7" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="27" y="57" class="tiny-label">F8 > 3?</text>
      
      <rect x="67" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="87" y="57" class="tiny-label">F11 < 7?</text>
      
      <line x1="17" y1="65" x2="12" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="37" y1="65" x2="42" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="77" y1="65" x2="72" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="97" y1="65" x2="102" y2="80" stroke="#333" stroke-width="1"/>
      
      <rect x="2" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="12" y="90" class="tiny-label">A</text>
      
      <rect x="32" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="42" y="90" class="tiny-label">A</text>
      
      <rect x="62" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="72" y="90" class="tiny-label">B</text>
      
      <rect x="92" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="102" y="90" class="tiny-label">B</text>
      
      <text x="57" y="115" class="label" font-weight="bold">Tree 3</text>
    </g>
    
    <!-- ... dots -->
    <text x="375" y="55" class="label" font-size="24">...</text>
    
    <!-- Tree N -->
    <g transform="translate(405, 10)">
      <rect x="27" y="0" width="60" height="25" rx="3" class="tree-node"/>
      <text x="57" y="16" class="tiny-label">F4 > 2.8?</text>
      
      <line x1="42" y1="25" x2="27" y2="45" stroke="#333" stroke-width="1.5"/>
      <line x1="72" y1="25" x2="87" y2="45" stroke="#333" stroke-width="1.5"/>
      
      <rect x="7" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="27" y="57" class="tiny-label">F9 < 4?</text>
      
      <rect x="67" y="45" width="40" height="20" rx="3" class="tree-node"/>
      <text x="87" y="57" class="tiny-label">F16 > 1?</text>
      
      <line x1="17" y1="65" x2="12" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="37" y1="65" x2="42" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="77" y1="65" x2="72" y2="80" stroke="#333" stroke-width="1"/>
      <line x1="97" y1="65" x2="102" y2="80" stroke="#333" stroke-width="1"/>
      
      <rect x="2" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="12" y="90" class="tiny-label">B</text>
      
      <rect x="32" y="80" width="20" height="15" rx="2" class="tree-leaf-b"/>
      <text x="42" y="90" class="tiny-label">B</text>
      
      <rect x="62" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="72" y="90" class="tiny-label">A</text>
      
      <rect x="92" y="80" width="20" height="15" rx="2" class="tree-leaf-a"/>
      <text x="102" y="90" class="tiny-label">A</text>
      
      <text x="57" y="115" class="label" font-weight="bold">Tree N</text>
    </g>
  </g>

  <!-- Arrows to Predictions -->
  <path d="M 307 440 L 307 470" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M 432 440 L 432 470" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M 557 440 L 557 470" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M 712 440 L 712 470" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Step 4: Individual Predictions -->
  <g transform="translate(250, 480)">
    <text x="260" y="0" class="subtitle">Prédictions pour un nouvel échantillon</text>
    
    <rect x="37" y="10" width="40" height="30" rx="3" class="vote-box"/>
    <text x="57" y="30" class="label" font-weight="bold">A</text>
    
    <rect x="162" y="10" width="40" height="30" rx="3" class="vote-box"/>
    <text x="182" y="30" class="label" font-weight="bold">B</text>
    
    <rect x="287" y="10" width="40" height="30" rx="3" class="vote-box"/>
    <text x="307" y="30" class="label" font-weight="bold">A</text>
    
    <text x="375" y="25" class="label" font-size="20">...</text>
    
    <rect x="442" y="10" width="40" height="30" rx="3" class="vote-box"/>
    <text x="462" y="30" class="label" font-weight="bold">A</text>
  </g>

  <!-- Arrow to Final Prediction -->
  <path d="M 450 530 L 450 560" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="550" class="label">Vote majoritaire</text>

  <!-- Step 5: Final Prediction -->
  <g transform="translate(350, 570)">
    <rect x="0" y="0" width="200" height="60" rx="5" class="final-box"/>
    <text x="100" y="25" class="subtitle">Prédiction Finale</text>
    <text x="100" y="45" class="label" font-size="16" font-weight="bold">Classe A (65% votes)</text>
  </g>

  <!-- Key Concepts Box -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="180" height="165" rx="5" fill="#fafafa" stroke="#666" stroke-width="1"/>
    <text x="90" y="20" class="subtitle">Concepts Clés</text>
    
    <text x="10" y="45" class="tiny-label" text-anchor="start" font-weight="bold">1. Bootstrap Sampling</text>
    <text x="15" y="60" class="tiny-label" text-anchor="start">Avec remise</text>
    <text x="15" y="73" class="tiny-label" text-anchor="start">~63% uniques</text>
    
    <text x="10" y="93" class="tiny-label" text-anchor="start" font-weight="bold">2. Random Features</text>
    <text x="15" y="108" class="tiny-label" text-anchor="start">√p features/split</text>
    
    <text x="10" y="128" class="tiny-label" text-anchor="start" font-weight="bold">3. Pas de pruning</text>
    <text x="15" y="143" class="tiny-label" text-anchor="start">Arbres profonds</text>
    
    <text x="10" y="158" class="tiny-label" text-anchor="start" font-weight="bold">4. Vote = Robustesse</text>
  </g>

  <!-- Parameters Box -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="180" height="125" rx="5" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1"/>
    <text x="90" y="20" class="subtitle">Hyperparamètres</text>
    
    <text x="10" y="42" class="tiny-label" text-anchor="start">• n_estimators = 100</text>
    <text x="10" y="58" class="tiny-label" text-anchor="start">• max_features = 'sqrt'</text>
    <text x="10" y="74" class="tiny-label" text-anchor="start">• max_depth = None</text>
    <text x="10" y="90" class="tiny-label" text-anchor="start">• min_samples_split = 2</text>
    <text x="10" y="106" class="tiny-label" text-anchor="start">• bootstrap = True</text>
  </g>
</svg>