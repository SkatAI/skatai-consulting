<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <defs>
    <style>
      .node-internal { fill: #e8f4f8; stroke: #2196F3; stroke-width: 2; }
      .node-leaf-yes { fill: #e8f5e9; stroke: #4CAF50; stroke-width: 2; }
      .node-leaf-no { fill: #ffebee; stroke: #f44336; stroke-width: 2; }
      .text-main { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .text-small { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #666; }
      .edge { stroke: #333; stroke-width: 2; fill: none; }
      .edge-label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title">Arbre de Décision : Prédiction d'Achat Client</text>
  
  <!-- Root Node -->
  <rect x="320" y="60" width="160" height="60" rx="5" class="node-internal"/>
  <text x="400" y="85" class="text-main">Revenus &gt; 50k€ ?</text>
  <text x="400" y="105" class="text-small">1000 samples</text>
  
  <!-- Left Branch (Non) -->
  <line x1="350" y1="120" x2="250" y2="180" class="edge"/>
  <text x="280" y="145" class="edge-label">Non</text>
  
  <!-- Left Node - Age > 25 -->
  <rect x="170" y="180" width="160" height="60" rx="5" class="node-internal"/>
  <text x="250" y="205" class="text-main">Âge &gt; 25 ans ?</text>
  <text x="250" y="225" class="text-small">400 samples</text>
  
  <!-- Right Branch (Oui) -->
  <line x1="450" y1="120" x2="550" y2="180" class="edge"/>
  <text x="520" y="145" class="edge-label">Oui</text>
  
  <!-- Right Node - Visites > 5 -->
  <rect x="470" y="180" width="160" height="60" rx="5" class="node-internal"/>
  <text x="550" y="205" class="text-main">Visites site &gt; 5 ?</text>
  <text x="550" y="225" class="text-small">600 samples</text>
  
  <!-- Left-Left Branch -->
  <line x1="200" y1="240" x2="150" y2="300" class="edge"/>
  <text x="165" y="265" class="edge-label">Non</text>
  
  <!-- Left-Left Leaf - N'achète pas -->
  <rect x="80" y="300" width="140" height="80" rx="5" class="node-leaf-no"/>
  <text x="150" y="330" class="text-main" font-weight="bold">N'ACHÈTE PAS</text>
  <text x="150" y="350" class="text-small">95% probabilité</text>
  <text x="150" y="365" class="text-small">150 samples</text>
  
  <!-- Left-Right Branch -->
  <line x1="300" y1="240" x2="350" y2="300" class="edge"/>
  <text x="335" y="265" class="edge-label">Oui</text>
  
  <!-- Left-Right Leaf - N'achète pas (moins sûr) -->
  <rect x="280" y="300" width="140" height="80" rx="5" class="node-leaf-no"/>
  <text x="350" y="330" class="text-main" font-weight="bold">N'ACHÈTE PAS</text>
  <text x="350" y="350" class="text-small">70% probabilité</text>
  <text x="350" y="365" class="text-small">250 samples</text>
  
  <!-- Right-Left Branch -->
  <line x1="500" y1="240" x2="450" y2="300" class="edge"/>
  <text x="465" y="265" class="edge-label">Non</text>
  
  <!-- Right-Left Node - Temps > 10min -->
  <rect x="370" y="300" width="160" height="60" rx="5" class="node-internal"/>
  <text x="450" y="325" class="text-main">Temps page &gt; 10min ?</text>
  <text x="450" y="345" class="text-small">200 samples</text>
  
  <!-- Right-Right Branch -->
  <line x1="600" y1="240" x2="650" y2="300" class="edge"/>
  <text x="635" y="265" class="edge-label">Oui</text>
  
  <!-- Right-Right Leaf - Achète -->
  <rect x="580" y="300" width="140" height="80" rx="5" class="node-leaf-yes"/>
  <text x="650" y="330" class="text-main" font-weight="bold">ACHÈTE</text>
  <text x="650" y="350" class="text-small">85% probabilité</text>
  <text x="650" y="365" class="text-small">400 samples</text>
  
  <!-- Right-Left-Left Branch -->
  <line x1="400" y1="360" x2="350" y2="420" class="edge"/>
  <text x="365" y="385" class="edge-label">Non</text>
  
  <!-- Right-Left-Left Leaf - N'achète pas -->
  <rect x="280" y="420" width="140" height="80" rx="5" class="node-leaf-no"/>
  <text x="350" y="450" class="text-main" font-weight="bold">N'ACHÈTE PAS</text>
  <text x="350" y="470" class="text-small">60% probabilité</text>
  <text x="350" y="485" class="text-small">120 samples</text>
  
  <!-- Right-Left-Right Branch -->
  <line x1="500" y1="360" x2="550" y2="420" class="edge"/>
  <text x="535" y="385" class="edge-label">Oui</text>
  
  <!-- Right-Left-Right Leaf - Achète -->
  <rect x="480" y="420" width="140" height="80" rx="5" class="node-leaf-yes"/>
  <text x="550" y="450" class="text-main" font-weight="bold">ACHÈTE</text>
  <text x="550" y="470" class="text-small">75% probabilité</text>
  <text x="550" y="485" class="text-small">80 samples</text>
  
  <!-- Legend -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" class="text-main" font-weight="bold" text-anchor="start">Légende:</text>
    
    <rect x="0" y="10" width="30" height="20" rx="3" class="node-internal"/>
    <text x="40" y="25" class="text-small" text-anchor="start">Nœud de décision</text>
    
    <rect x="180" y="10" width="30" height="20" rx="3" class="node-leaf-yes"/>
    <text x="220" y="25" class="text-small" text-anchor="start">Prédiction: Achète</text>
    
    <rect x="360" y="10" width="30" height="20" rx="3" class="node-leaf-no"/>
    <text x="400" y="25" class="text-small" text-anchor="start">Prédiction: N'achète pas</text>
  </g>
  
  <!-- Features explanation -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" class="text-small" font-weight="bold" text-anchor="start">Features utilisées:</text>
    <text x="0" y="20" class="text-small" text-anchor="start">• Revenus annuels</text>
    <text x="0" y="35" class="text-small" text-anchor="start">• Âge du client</text>
    <text x="0" y="50" class="text-small" text-anchor="start">• Nombre de visites</text>
    <text x="0" y="65" class="text-small" text-anchor="start">• Temps sur page</text>
  </g>
</svg>