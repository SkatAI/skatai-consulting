<rect x="1016" y="405" width="218" height="36" rx="8" class="" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1125.0" y="428" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#065F46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Receives rows with same hash</text>
<rect x="1016" y="455" width="218" height="48" rx="8" class="" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="1125.0" y="478" text-anchor="middle" font-size="14" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Join matching rows</text>
<text x="1125.0" y="498" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">A⋈B on customer_id</text><rect x="1300" y="440" width="250" height="160" rx="12" class="" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<text x="1425.0" y="466" text-anchor="middle" font-size="16" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Worker 2</text>
<rect x="1316" y="485" width="218" height="36" rx="8" class="" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1425.0" y="508" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#065F46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Receives rows with same hash</text>
<rect x="1316" y="535" width="218" height="48" rx="8" class="" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="1425.0" y="558" text-anchor="middle" font-size="14" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Join matching rows</text>
<text x="1425.0" y="578" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">A⋈B on customer_id</text><polyline points="620,335 690,340" class="" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,335 990,420" class="" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,335 1290,500" class="" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,485 690,340" class="" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,485 990,420" class="" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="620,485 1290,500" class="" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="600" width="640" height="120" rx="14" class="" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/><text x="700" y="630" text-anchor="middle" font-size="16" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Partitioning logic (example):</text><text x="410" y="660" text-anchor="start" font-size="14" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Compute p = hash(customer_id) % N</text>
<text x="410" y="682" text-anchor="start" font-size="14" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Send row to Worker p</text>
<text x="410" y="704" text-anchor="start" font-size="14" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Both tables use the same hash → matching keys land on the same worker</text>
