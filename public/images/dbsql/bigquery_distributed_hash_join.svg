<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distributed Hash Join Diagram">

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
    <polygon points="0 0, 10 3.5, 0 7" fill="#111827"/>
  </marker>
  <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
  </filter>
</defs>

<style>
    .card { filter: url(#softShadow); }
</style>
<rect x="0" y="0" width="1200" height="800" rx="0" class="" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/><text x="600.0" y="50" text-anchor="middle" font-size="28" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Distributed Hash Join (BigQuery)</text><text x="600.0" y="80" text-anchor="middle" font-size="16" font-weight="normal" class="" fill="#374151" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Data is split across many machines; keys with the same hash meet on the same worker.</text><rect x="60" y="110" width="1080" height="120" rx="16" class="" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="600" y="150" text-anchor="middle" font-size="18" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">A distributed hash join means BigQuery splits the data across many machines.</text><text x="100" y="185" text-anchor="start" font-size="16" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Each machine hashes the join key (e.g., customer_id).</text>
<text x="100" y="207" text-anchor="start" font-size="16" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Rows with the same hash are sent to the same worker (shuffle).</text>
<text x="100" y="229" text-anchor="start" font-size="16" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• That worker joins only the matching rows it received.</text><rect x="80" y="270" width="220" height="110" rx="12" class="" fill="#FFFFFF" stroke="#111827" stroke-width="2"/><text x="190.0" y="300" text-anchor="middle" font-size="18" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Table A</text><text x="100" y="330" text-anchor="start" font-size="14" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Rows</text>
<text x="100" y="352" text-anchor="start" font-size="14" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Join key: customer_id</text><rect x="80" y="420" width="220" height="110" rx="12" class="" fill="#FFFFFF" stroke="#111827" stroke-width="2"/><text x="190.0" y="450" text-anchor="middle" font-size="18" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Table B</text><text x="100" y="480" text-anchor="start" font-size="14" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Rows</text>
<text x="100" y="502" text-anchor="start" font-size="14" font-weight="normal" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">• Join key: customer_id</text><rect x="380" y="300" width="240" height="70" rx="12" class="" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><text x="500.0" y="342" text-anchor="middle" font-size="16" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Hash by join key</text><text x="500.0" y="362" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#6B7280" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">hash(customer_id)</text><rect x="380" y="450" width="240" height="70" rx="12" class="" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><text x="500.0" y="492" text-anchor="middle" font-size="16" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Hash by join key</text><text x="500.0" y="512" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#6B7280" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">hash(customer_id)</text><line x1="300" y1="325" x2="380" y2="335" class="" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="300" y1="475" x2="380" y2="485" class="" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="680" y="200" width="890" height="420" rx="18" class="" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" stroke-dasharray="6 6"/><text x="1125.0" y="228" text-anchor="middle" font-size="16" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Workers (many machines)</text><rect x="700" y="280" width="250" height="160" rx="12" class="" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<text x="825.0" y="306" text-anchor="middle" font-size="16" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Worker 0</text>
<rect x="716" y="325" width="218" height="36" rx="8" class="" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="825.0" y="348" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#065F46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Receives rows with same hash</text>
<rect x="716" y="375" width="218" height="48" rx="8" class="" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="825.0" y="398" text-anchor="middle" font-size="14" font-weight="600" class="" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">Join matching rows</text>
<text x="825.0" y="418" text-anchor="middle" font-size="12" font-weight="normal" class="" fill="#1F2937" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">A⋈B on customer_id</text><rect x="1000" y="360" width="250" height="160" rx="12" class="" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
