<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Linear Storage of Rows in a Row-Oriented Database
  </text>
  
  <!-- Page boundary -->
  <rect x="50" y="80" width="1100" height="140" fill="#f0f0f0" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="70" font-size="12" fill="#666">8 KB Page</text>
  
  <!-- Row 1 -->
  <g>
    <!-- Header -->
    <rect x="60" y="100" width="35" height="100" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
    <text x="77.5" y="155" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">HDR</text>
    
    <!-- Data -->
    <rect x="95" y="100" width="120" height="100" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="155" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">Row 1 Data</text>
  </g>
  
  <!-- Row 2 -->
  <g>
    <!-- Header -->
    <rect x="215" y="100" width="35" height="100" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
    <text x="232.5" y="155" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">HDR</text>
    
    <!-- Data -->
    <rect x="250" y="100" width="110" height="100" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="305" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">Row 2 Data</text>
  </g>
  
  <!-- Row 3 -->
  <g>
    <!-- Header -->
    <rect x="360" y="100" width="35" height="100" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
    <text x="377.5" y="155" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">HDR</text>
    
    <!-- Data -->
    <rect x="395" y="100" width="125" height="100" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="457.5" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">Row 3 Data</text>
  </g>
  
  <!-- Row 4 -->
  <g>
    <!-- Header -->
    <rect x="520" y="100" width="35" height="100" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
    <text x="537.5" y="155" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">HDR</text>
    
    <!-- Data -->
    <rect x="555" y="100" width="105" height="100" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="607.5" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">Row 4 Data</text>
  </g>
  
  <!-- Continue indicator -->
  <text x="680" y="155" font-size="16" font-weight="bold" fill="#666">...</text>
  
  <!-- Row N -->
  <g>
    <!-- Header -->
    <rect x="720" y="100" width="35" height="100" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
    <text x="737.5" y="155" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">HDR</text>
    
    <!-- Data -->
    <rect x="755" y="100" width="115" height="100" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="812.5" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">Row N Data</text>
  </g>
  
  <!-- Legend -->
  <g>
    <!-- Header legend -->
    <rect x="880" y="95" width="20" height="20" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
    <text x="910" y="110" font-size="12" fill="#333">Header: row length, column offsets</text>
    
    <!-- Data legend -->
    <rect x="880" y="125" width="20" height="20" fill="#99ccff" stroke="#0066cc" stroke-width="1"/>
    <text x="910" y="140" font-size="12" fill="#333">Data: column values</text>
  </g>
  
  <!-- Bottom annotation -->
  <text x="600" y="260" font-size="11" fill="#666" text-anchor="middle">
    Each row has a header followed by its data. The DB reads the header to find row boundaries.
  </text>
</svg>