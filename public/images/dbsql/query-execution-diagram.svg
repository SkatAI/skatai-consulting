<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Query Execution: Physical Operations
  </text>
  
  <!-- SQL Query Box -->
  <rect x="250" y="50" width="300" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="400" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976d2">
    SQL Query (Declarative)
  </text>
  <text x="400" y="95" font-size="12" text-anchor="middle" fill="#424242" font-family="monospace">
    SELECT * FROM trees WHERE height > 20
  </text>
  
  <!-- Arrow down -->
  <path d="M 400 110 L 400 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Query Optimizer -->
  <rect x="250" y="140" width="300" height="50" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="400" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57c00">
    Query Optimizer
  </text>
  <text x="400" y="178" font-size="11" text-anchor="middle" fill="#666">
    Decides HOW to execute
  </text>
  
  <!-- Arrow down -->
  <path d="M 400 190 L 400 220" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Physical Operations Title -->
  <text x="400" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="#c62828">
    Physical Operations (Algorithms)
  </text>
  
  <!-- Storage Layer -->
  <g id="storage-layer">
    <rect x="50" y="270" width="700" height="120" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="5"/>
    <text x="60" y="290" font-size="14" font-weight="bold" fill="#424242">
      1. Data Access
    </text>
    
    <!-- Disk Storage -->
    <g transform="translate(80, 300)">
      <circle cx="40" cy="35" r="30" fill="#607d8b" stroke="#37474f" stroke-width="2"/>
      <circle cx="40" cy="35" r="20" fill="none" stroke="#cfd8dc" stroke-width="2"/>
      <circle cx="40" cy="35" r="3" fill="#cfd8dc"/>
      <text x="40" y="80" font-size="11" text-anchor="middle" fill="#424242">Disk I/O</text>
    </g>
    
    <!-- Memory -->
    <g transform="translate(200, 300)">
      <rect x="10" y="10" width="60" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="3"/>
      <rect x="15" y="15" width="50" height="8" fill="#81c784" rx="2"/>
      <rect x="15" y="28" width="50" height="8" fill="#81c784" rx="2"/>
      <rect x="15" y="41" width="50" height="8" fill="#81c784" rx="2"/>
      <text x="40" y="80" font-size="11" text-anchor="middle" fill="#424242">RAM</text>
    </g>
    
    <!-- Buffer Pool -->
    <g transform="translate(320, 300)">
      <rect x="10" y="10" width="60" height="50" fill="#ff9800" stroke="#e65100" stroke-width="2" rx="3"/>
      <path d="M 20 20 L 60 20 L 60 50 L 20 50 Z M 30 20 L 30 50 M 40 20 L 40 50 M 50 20 L 50 50" 
            stroke="#fff3e0" stroke-width="2" fill="none"/>
      <text x="40" y="80" font-size="11" text-anchor="middle" fill="#424242">Buffer Pool</text>
    </g>
    
    <!-- Arrow to next section -->
    <path d="M 400 360 L 400 390" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Scanning Layer -->
  <g id="scanning-layer">
    <rect x="50" y="410" width="700" height="120" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5"/>
    <text x="60" y="430" font-size="14" font-weight="bold" fill="#424242">
      2. Scanning Algorithms
    </text>
    
    <!-- Sequential Scan -->
    <g transform="translate(80, 440)">
      <rect x="5" y="5" width="80" height="50" fill="#fff" stroke="#4caf50" stroke-width="2" rx="3"/>
      <path d="M 15 15 L 75 15 M 15 25 L 75 25 M 15 35 L 75 35 M 15 45 L 75 45" 
            stroke="#4caf50" stroke-width="2"/>
      <path d="M 10 30 L 30 30" stroke="#f44336" stroke-width="3" marker-end="url(#arrowhead-red)"/>
      <text x="45" y="75" font-size="10" text-anchor="middle" fill="#424242">Sequential</text>
      <text x="45" y="88" font-size="10" text-anchor="middle" fill="#424242">Scan</text>
    </g>
    
    <!-- Index Scan -->
    <g transform="translate(200, 440)">
      <rect x="5" y="5" width="80" height="50" fill="#fff" stroke="#2196f3" stroke-width="2" rx="3"/>
      <!-- Tree structure -->
      <circle cx="45" cy="18" r="4" fill="#2196f3"/>
      <circle cx="30" cy="35" r="4" fill="#2196f3"/>
      <circle cx="60" cy="35" r="4" fill="#2196f3"/>
      <line x1="45" y1="22" x2="30" y2="31" stroke="#2196f3" stroke-width="2"/>
      <line x1="45" y1="22" x2="60" y2="31" stroke="#2196f3" stroke-width="2"/>
      <text x="45" y="75" font-size="10" text-anchor="middle" fill="#424242">Index</text>
      <text x="45" y="88" font-size="10" text-anchor="middle" fill="#424242">Scan</text>
    </g>
    
    <!-- Bitmap Scan -->
    <g transform="translate(320, 440)">
      <rect x="5" y="5" width="80" height="50" fill="#fff" stroke="#9c27b0" stroke-width="2" rx="3"/>
      <rect x="15" y="15" width="8" height="8" fill="#9c27b0"/>
      <rect x="28" y="15" width="8" height="8" fill="none" stroke="#9c27b0" stroke-width="1"/>
      <rect x="41" y="15" width="8" height="8" fill="#9c27b0"/>
      <rect x="54" y="15" width="8" height="8" fill="none" stroke="#9c27b0" stroke-width="1"/>
      <rect x="67" y="15" width="8" height="8" fill="#9c27b0"/>
      <rect x="15" y="28" width="8" height="8" fill="none" stroke="#9c27b0" stroke-width="1"/>
      <rect x="28" y="28" width="8" height="8" fill="#9c27b0"/>
      <rect x="41" y="28" width="8" height="8" fill="none" stroke="#9c27b0" stroke-width="1"/>
      <rect x="54" y="28" width="8" height="8" fill="#9c27b0"/>
      <rect x="67" y="28" width="8" height="8" fill="none" stroke="#9c27b0" stroke-width="1"/>
      <text x="45" y="75" font-size="10" text-anchor="middle" fill="#424242">Bitmap</text>
      <text x="45" y="88" font-size="10" text-anchor="middle" fill="#424242">Scan</text>
    </g>
    
    <path d="M 400 500 L 400 530" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Processing Layer -->
  <g id="processing-layer">
    <rect x="50" y="550" width="700" height="140" fill="#fff8e1" stroke="#ffc107" stroke-width="2" rx="5"/>
    <text x="60" y="570" font-size="14" font-weight="bold" fill="#424242">
      3. Processing Operations
    </text>
    
    <!-- Filtering -->
    <g transform="translate(80, 580)">
      <rect x="5" y="5" width="80" height="50" fill="#fff" stroke="#ff5722" stroke-width="2" rx="3"/>
      <path d="M 25 15 L 65 15 L 55 35 L 35 35 Z" fill="none" stroke="#ff5722" stroke-width="2"/>
      <circle cx="30" cy="42" r="3" fill="#4caf50"/>
      <circle cx="45" cy="42" r="3" fill="#f44336"/>
      <circle cx="60" cy="42" r="3" fill="#4caf50"/>
      <text x="45" y="75" font-size="10" text-anchor="middle" fill="#424242">Filtering</text>
      <text x="45" y="88" font-size="9" text-anchor="middle" fill="#666">WHERE</text>
    </g>
    
    <!-- Sorting -->
    <g transform="translate(200, 580)">
      <rect x="5" y="5" width="80" height="50" fill="#fff" stroke="#3f51b5" stroke-width="2" rx="3"/>
      <rect x="15" y="35" width="10" height="15" fill="#3f51b5"/>
      <rect x="30" y="25" width="10" height="25" fill="#3f51b5"/>
      <rect x="45" y="15" width="10" height="35" fill="#3f51b5"/>
      <rect x="60" y="20" width="10" height="30" fill="#3f51b5"/>
      <text x="45" y="75" font-size="10" text-anchor="middle" fill="#424242">Sorting</text>
      <text x="45" y="88" font-size="9" text-anchor="middle" fill="#666">ORDER BY</text>
    </g>
    
    <!-- Joining -->
    <g transform="translate(320, 580)">
      <rect x="5" y="5" width="80" height="50" fill="#fff" stroke="#00bcd4" stroke-width="2" rx="3"/>
      <circle cx="35" cy="30" r="15" fill="none" stroke="#00bcd4" stroke-width="2"/>
      <circle cx="55" cy="30" r="15" fill="none" stroke="#00bcd4" stroke-width="2"/>
      <path d="M 40 25 L 40 35 A 10 10 0 0 0 50 35 L 50 25" fill="#00bcd4" opacity="0.3"/>
      <text x="45" y="75" font-size="10" text-anchor="middle" fill="#424242">Joining</text>
      <text x="45" y="88" font-size="9" text-anchor="middle" fill="#666">JOIN</text>
    </g>
    
    <!-- Aggregating -->
    <g transform="translate(440, 580)">
      <rect x="5" y="5" width="80" height="50" fill="#fff" stroke="#673ab7" stroke-width="2" rx="3"/>
      <text x="45" y="25" font-size="20" font-weight="bold" text-anchor="middle" fill="#673ab7">Σ</text>
      <text x="45" y="45" font-size="12" text-anchor="middle" fill="#673ab7">COUNT</text>
      <text x="45" y="75" font-size="10" text-anchor="middle" fill="#424242">Aggregating</text>
      <text x="45" y="88" font-size="9" text-anchor="middle" fill="#666">GROUP BY</text>
    </g>
    
    <path d="M 400 660 L 400 690" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Result Layer -->
  <g id="result-layer">
    <rect x="250" y="710" width="300" height="120" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="400" y="735" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      4. Result Set
    </text>
    
    <!-- Table result -->
    <g transform="translate(280, 750)">
      <rect x="0" y="0" width="240" height="60" fill="#fff" stroke="#388e3c" stroke-width="2" rx="3"/>
      <line x1="0" y1="20" x2="240" y2="20" stroke="#388e3c" stroke-width="2"/>
      <line x1="80" y1="0" x2="80" y2="60" stroke="#388e3c" stroke-width="1"/>
      <line x1="160" y1="0" x2="160" y2="60" stroke="#388e3c" stroke-width="1"/>
      
      <text x="40" y="14" font-size="10" font-weight="bold" text-anchor="middle" fill="#1b5e20">id</text>
      <text x="120" y="14" font-size="10" font-weight="bold" text-anchor="middle" fill="#1b5e20">height</text>
      <text x="200" y="14" font-size="10" font-weight="bold" text-anchor="middle" fill="#1b5e20">circum</text>
      
      <text x="40" y="36" font-size="10" text-anchor="middle" fill="#424242">2</text>
      <text x="120" y="36" font-size="10" text-anchor="middle" fill="#424242">22</text>
      <text x="200" y="36" font-size="10" text-anchor="middle" fill="#424242">180</text>
      
      <text x="40" y="52" font-size="10" text-anchor="middle" fill="#424242">4</text>
      <text x="120" y="52" font-size="10" text-anchor="middle" fill="#424242">25</text>
      <text x="200" y="52" font-size="10" text-anchor="middle" fill="#424242">200</text>
    </g>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <text x="50" y="860" font-size="12" font-weight="bold" fill="#424242">
      Key Point:
    </text>
    <text x="50" y="880" font-size="11" fill="#666">
      Each step involves actual physical operations: reading bytes, comparing values, moving data in memory
    </text>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f44336" />
    </marker>
  </defs>
</svg>