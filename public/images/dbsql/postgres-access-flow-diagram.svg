<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e3a5f">PostgreSQL Access Control Flow</text>
  
  <!-- User -->
  <circle cx="100" cy="250" r="35" fill="#5cb85c" stroke="#4cae4c" stroke-width="3"/>
  <text x="100" y="257" text-anchor="middle" fill="white" font-size="16" font-weight="bold">USER</text>
  
  <!-- Step 1 -->
  <text x="100" y="320" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">1</text>
  <text x="100" y="345" text-anchor="middle" font-size="14" fill="#666">Tries to</text>
  <text x="100" y="365" text-anchor="middle" font-size="14" fill="#666">connect</text>
  
  <!-- Arrow 1 -->
  <path d="M 140 250 L 220 250" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- pg_hba.conf -->
  <rect x="230" y="200" width="160" height="100" fill="#336791" stroke="#1e3a5f" stroke-width="3" rx="8"/>
  <text x="310" y="235" text-anchor="middle" fill="white" font-size="18" font-weight="bold">pg_hba.conf</text>
  <text x="310" y="260" text-anchor="middle" fill="#b8d4e8" font-size="13">Can you connect?</text>
  <text x="310" y="280" text-anchor="middle" fill="#b8d4e8" font-size="13">How to authenticate?</text>
  
  <!-- Step 2 -->
  <text x="310" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">2</text>
  <text x="310" y="365" text-anchor="middle" font-size="14" fill="#666">Enter password</text>
  <text x="310" y="385" text-anchor="middle" font-size="14" fill="#5cb85c">✓ Authenticated</text>
  
  <!-- Arrow 2 -->
  <path d="M 400 250 L 480 250" stroke="#5cb85c" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="440" y="235" text-anchor="middle" font-size="13" fill="#5cb85c">Connected!</text>
  
  <!-- Database -->
  <rect x="490" y="200" width="160" height="100" fill="#4a90d9" stroke="#2c5aa0" stroke-width="3" rx="8"/>
  <text x="570" y="235" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Database</text>
  <text x="570" y="260" text-anchor="middle" fill="#e0f0ff" font-size="13">GRANT checks</text>
  <text x="570" y="280" text-anchor="middle" fill="#e0f0ff" font-size="13">permissions</text>
  
  <!-- Step 3 -->
  <text x="570" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">3</text>
  <text x="570" y="365" text-anchor="middle" font-size="14" fill="#666">SELECT * FROM products</text>
  <text x="570" y="385" text-anchor="middle" font-size="14" fill="#5cb85c">✓ Permission granted</text>
  
  <!-- Summary -->
  <rect x="200" y="430" width="400" height="50" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="5"/>
  <text x="400" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Two Layers of Security</text>
  <text x="400" y="470" text-anchor="middle" font-size="12" fill="#666">pg_hba.conf (connection) → GRANT (permissions)</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#5cb85c"/>
    </marker>
  </defs>
</svg>