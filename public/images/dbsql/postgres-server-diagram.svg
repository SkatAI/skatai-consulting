<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e3a5f">Server vs Databases</text>
  
  <!-- Connection Tools (moved to top) -->
  <!-- psql -->
  <rect x="150" y="80" width="120" height="60" fill="#5cb85c" stroke="#4cae4c" stroke-width="2" rx="5"/>
  <text x="210" y="115" text-anchor="middle" fill="white" font-size="18" font-weight="bold">psql</text>
  <text x="210" y="130" text-anchor="middle" fill="white" font-size="11">command line</text>
  
  <!-- pgAdmin -->
  <rect x="340" y="80" width="120" height="60" fill="#5bc0de" stroke="#46b8da" stroke-width="2" rx="5"/>
  <text x="400" y="115" text-anchor="middle" fill="white" font-size="18" font-weight="bold">pgAdmin</text>
  <text x="400" y="130" text-anchor="middle" fill="white" font-size="11">GUI tool</text>
  
  <!-- Your Application -->
  <rect x="530" y="80" width="120" height="60" fill="#f0ad4e" stroke="#eea236" stroke-width="2" rx="5"/>
  <text x="590" y="115" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Your App</text>
  <text x="590" y="130" text-anchor="middle" fill="white" font-size="11">via driver</text>
  
  <!-- Connection arrows (pointing down) -->
  <!-- From psql -->
  <path d="M 210 140 L 300 200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- From pgAdmin -->
  <path d="M 400 140 L 400 200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- From Your App -->
  <path d="M 590 140 L 500 200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Connection label -->
  <text x="400" y="175" text-anchor="middle" font-size="14" fill="#666" font-style="italic">Connect to server, query databases</text>
  
  <!-- PostgreSQL Server Container -->
  <rect x="200" y="210" width="400" height="300" fill="#336791" stroke="#1e3a5f" stroke-width="3" rx="10"/>
  <text x="400" y="240" text-anchor="middle" fill="white" font-size="24" font-weight="bold">PostgreSQL Server</text>
  <text x="400" y="265" text-anchor="middle" fill="#b8d4e8" font-size="14">(launched when you run 'postgres')</text>
  
  <!-- Databases inside the server -->
  <!-- Database 1 -->
  <rect x="240" y="300" width="140" height="80" fill="#4a90d9" stroke="#2c5aa0" stroke-width="2" rx="5"/>
  <text x="310" y="330" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Database 1</text>
  <text x="310" y="355" text-anchor="middle" fill="#e0f0ff" font-size="12">myapp_db</text>
  
  <!-- Database 2 -->
  <rect x="420" y="300" width="140" height="80" fill="#4a90d9" stroke="#2c5aa0" stroke-width="2" rx="5"/>
  <text x="490" y="330" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Database 2</text>
  <text x="490" y="355" text-anchor="middle" fill="#e0f0ff" font-size="12">test_db</text>
  
  <!-- Database 3 -->
  <rect x="330" y="400" width="140" height="80" fill="#4a90d9" stroke="#2c5aa0" stroke-width="2" rx="5"/>
  <text x="400" y="430" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Database 3</text>
  <text x="400" y="455" text-anchor="middle" fill="#e0f0ff" font-size="12">production_db</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Note -->
  <text x="620" y="360" font-size="12" fill="#666">* Can have 0, 1, or</text>
  <text x="620" y="375" font-size="12" fill="#666">  multiple databases</text>
  <text x="620" y="390" font-size="12" fill="#666">  on one server</text>
</svg>