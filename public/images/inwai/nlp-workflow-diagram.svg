<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    NLP Pipeline Workflow
  </text>
  
  <!-- Raw Corpus -->
  <rect x="250" y="60" width="300" height="80" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Raw Corpus
  </text>
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    "This movie is really amazing!"
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 400 140 L 400 170" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Preprocessing Box -->
  <rect x="200" y="170" width="400" height="200" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Preprocessing
  </text>
  
  <!-- Tokenization -->
  <rect x="220" y="210" width="360" height="45" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    1. Tokenization
  </text>
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    ["This", "movie", "is", "really", "amazing", "!"]
  </text>
  
  <!-- Stop Words -->
  <rect x="220" y="265" width="360" height="45" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    2. Remove Stop Words
  </text>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    ["movie", "really", "amazing"]
  </text>
  
  <!-- Lemmatization -->
  <rect x="220" y="320" width="360" height="45" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    3. Lemmatization
  </text>
  <text x="400" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    ["movie", "really", "amaze"]
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 400 370 L 400 410" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Feature Extraction -->
  <rect x="200" y="410" width="400" height="120" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Feature Extraction: TF-IDF
  </text>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Convert text to numerical vectors
  </text>
  
  <!-- Matrix representation -->
  <g transform="translate(280, 480)">
    <rect x="0" y="0" width="240" height="35" rx="3" fill="white" opacity="0.2"/>
    <text x="10" y="15" font-family="monospace" font-size="10" fill="white">Doc1: [0.42, 0.00, 0.58, ...]</text>
    <text x="10" y="28" font-family="monospace" font-size="10" fill="white">Doc2: [0.00, 0.71, 0.29, ...]</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 400 530 L 400 570" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Machine Learning -->
  <rect x="200" y="570" width="400" height="80" rx="10" fill="#16a085" stroke="#138d75" stroke-width="2"/>
  <text x="400" y="600" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Machine Learning Model
  </text>
  <text x="400" y="625" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    (Naive Bayes, SVM, Logistic Regression, etc.)
  </text>
  
  <!-- Arrow 4 -->
  <path d="M 400 650 L 400 690" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Classification Task -->
  <rect x="200" y="690" width="400" height="100" rx="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="400" y="720" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Classification Task
  </text>
  <text x="400" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Examples:
  </text>
  <text x="400" y="765" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Sentiment Analysis (Positive/Negative)
  </text>
  <text x="400" y="780" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Spam Detection • Topic Classification
  </text>
  
  <!-- Arrow 5 -->
  <path d="M 400 790 L 400 820" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Output -->
  <rect x="300" y="820" width="200" height="50" rx="10" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="845" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Output
  </text>
  <text x="400" y="860" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Sentiment: Positive ✓
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Side annotations -->
  <text x="50" y="270" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#7f8c8d" text-anchor="middle" transform="rotate(-90 50 270)">
    Text Cleaning
  </text>
  
  <text x="50" y="470" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#7f8c8d" text-anchor="middle" transform="rotate(-90 50 470)">
    Vectorization
  </text>
  
  <text x="50" y="610" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#7f8c8d" text-anchor="middle" transform="rotate(-90 50 610)">
    Training
  </text>
  
  <text x="50" y="740" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#7f8c8d" text-anchor="middle" transform="rotate(-90 50 740)">
    Prediction
  </text>
</svg>