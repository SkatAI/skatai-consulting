<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Comment le contexte sémantique est préservé ?
  </text>
  
  <!-- Section 1: Attention Mechanism -->
  <g id="attention-section">
    <!-- Background -->
    <rect x="50" y="60" width="500" height="320" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
    
    <!-- Title -->
    <text x="300" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#2980b9">
      Mécanisme d'attention
    </text>
    
    <!-- Sentence words -->
    <text x="100" y="130" font-size="14" fill="#34495e">Exemple: "Le chien mange sa gamelle"</text>
    
    <!-- Words as nodes -->
    <circle cx="100" cy="180" r="25" fill="#3498db" opacity="0.3"/>
    <text x="100" y="185" font-size="12" text-anchor="middle" fill="#2c3e50">Le</text>
    
    <circle cx="180" cy="180" r="25" fill="#3498db" opacity="0.3"/>
    <text x="180" y="185" font-size="12" text-anchor="middle" fill="#2c3e50">chien</text>
    
    <circle cx="260" cy="180" r="25" fill="#e74c3c" opacity="0.8"/>
    <text x="260" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="white">mange</text>
    
    <circle cx="340" cy="180" r="25" fill="#3498db" opacity="0.3"/>
    <text x="340" y="185" font-size="12" text-anchor="middle" fill="#2c3e50">sa</text>
    
    <circle cx="420" cy="180" r="25" fill="#3498db" opacity="0.3"/>
    <text x="420" y="185" font-size="12" text-anchor="middle" fill="#2c3e50">gamelle</text>
    
    <!-- Attention arrows -->
    <!-- mange -> chien (strong) -->
    <path d="M 260 160 Q 220 140 180 160" fill="none" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowred)"/>
    <text x="210" y="135" font-size="10" fill="#e74c3c" font-weight="bold">0.8</text>
    
    <!-- mange -> gamelle (strong) -->
    <path d="M 260 200 Q 340 220 420 200" fill="none" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowred)"/>
    <text x="340" y="235" font-size="10" fill="#e74c3c" font-weight="bold">0.7</text>
    
    <!-- mange -> Le (weak) -->
    <path d="M 250 165 L 110 165" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="170" y="160" font-size="10" fill="#95a5a6">0.1</text>
    
    <!-- mange -> sa (weak) -->
    <path d="M 270 165 L 350 165" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="310" y="160" font-size="10" fill="#95a5a6">0.2</text>
    
    <!-- Explanation -->
    <text x="80" y="270" font-size="13" fill="#34495e">
      <tspan x="80" dy="0">• "mange" regarde tous les mots</tspan>
      <tspan x="80" dy="18">• Attention forte sur "chien" (sujet)</tspan>
      <tspan x="80" dy="18">• Attention forte sur "gamelle" (objet)</tspan>
      <tspan x="80" dy="18">• Attention faible sur "Le", "sa"</tspan>
    </text>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
      </marker>
    </defs>
  </g>
  
  <!-- Section 2: Positional Encoding -->
  <g id="positional-section">
    <!-- Background -->
    <rect x="600" y="60" width="550" height="320" fill="#fff5e6" stroke="#f39c12" stroke-width="2" rx="10"/>
    
    <!-- Title -->
    <text x="875" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#d68910">
      Positional Encoding
    </text>
    
    <!-- Example 1 -->
    <text x="620" y="130" font-size="14" font-weight="bold" fill="#34495e">"Le chien mord l'homme"</text>
    
    <g id="sentence1">
      <rect x="620" y="145" width="80" height="35" fill="#3498db" rx="5"/>
      <text x="660" y="165" font-size="11" text-anchor="middle" fill="white">Le chien</text>
      <text x="660" y="178" font-size="9" text-anchor="middle" fill="#ecf0f1">pos: 0-1</text>
      
      <rect x="715" y="145" width="60" height="35" fill="#e74c3c" rx="5"/>
      <text x="745" y="165" font-size="11" text-anchor="middle" fill="white">mord</text>
      <text x="745" y="178" font-size="9" text-anchor="middle" fill="#ecf0f1">pos: 2</text>
      
      <rect x="790" y="145" width="80" height="35" fill="#2ecc71" rx="5"/>
      <text x="830" y="165" font-size="11" text-anchor="middle" fill="white">l'homme</text>
      <text x="830" y="178" font-size="9" text-anchor="middle" fill="#ecf0f1">pos: 3-4</text>
    </g>
    
    <text x="900" y="168" font-size="16" fill="#e74c3c">→ 🐕➜👨</text>
    
    <!-- Arrow down -->
    <path d="M 875 195 L 875 210" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowgray)"/>
    <text x="890" y="205" font-size="12" fill="#7f8c8d">≠</text>
    
    <!-- Example 2 -->
    <text x="620" y="235" font-size="14" font-weight="bold" fill="#34495e">"L'homme mord le chien"</text>
    
    <g id="sentence2">
      <rect x="620" y="250" width="80" height="35" fill="#2ecc71" rx="5"/>
      <text x="660" y="270" font-size="11" text-anchor="middle" fill="white">L'homme</text>
      <text x="660" y="283" font-size="9" text-anchor="middle" fill="#ecf0f1">pos: 0-1</text>
      
      <rect x="715" y="250" width="60" height="35" fill="#e74c3c" rx="5"/>
      <text x="745" y="270" font-size="11" text-anchor="middle" fill="white">mord</text>
      <text x="745" y="283" font-size="9" text-anchor="middle" fill="#ecf0f1">pos: 2</text>
      
      <rect x="790" y="250" width="80" height="35" fill="#3498db" rx="5"/>
      <text x="830" y="270" font-size="11" text-anchor="middle" fill="white">le chien</text>
      <text x="830" y="283" font-size="9" text-anchor="middle" fill="#ecf0f1">pos: 3-4</text>
    </g>
    
    <text x="900" y="273" font-size="16" fill="#e74c3c">→ 👨➜🐕</text>
    
    <!-- Explanation -->
    <text x="620" y="320" font-size="13" fill="#34495e">
      <tspan x="620" dy="0">Position permet de distinguer qui fait l'action !</tspan>
      <tspan x="620" dy="18">Même mots, ordre différent = sens différent</tspan>
    </text>
    
    <defs>
      <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#95a5a6"/>
      </marker>
    </defs>
  </g>
  
  <!-- Section 3: Stacked Layers -->
  <g id="layers-section">
    <!-- Background -->
    <rect x="50" y="420" width="1100" height="350" fill="#f4ecf7" stroke="#9b59b6" stroke-width="2" rx="10"/>
    
    <!-- Title -->
    <text x="600" y="450" font-size="18" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Layers empilées (Deep Neural Network)
    </text>
    
    <!-- Input -->
    <text x="120" y="495" font-size="12" text-anchor="middle" fill="#34495e" font-weight="bold">INPUT</text>
    <text x="120" y="510" font-size="11" text-anchor="middle" fill="#7f8c8d">"Le chien mange"</text>
    
    <!-- Layer 1 (Low level - Syntax) -->
    <rect x="220" y="475" width="180" height="80" fill="#e8daef" stroke="#9b59b6" stroke-width="2" rx="8"/>
    <text x="310" y="495" font-size="14" font-weight="bold" text-anchor="middle" fill="#8e44ad">Layer 1-3</text>
    <text x="310" y="515" font-size="12" text-anchor="middle" fill="#34495e">Syntaxe de base</text>
    <text x="310" y="532" font-size="10" text-anchor="middle" fill="#7f8c8d">• Structure phrase</text>
    <text x="310" y="547" font-size="10" text-anchor="middle" fill="#7f8c8d">• POS tagging</text>
    
    <!-- Arrow -->
    <path d="M 160 515 L 210 515" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowpurple)"/>
    
    <!-- Layer 2 (Mid level) -->
    <rect x="450" y="475" width="180" height="80" fill="#d2b4de" stroke="#9b59b6" stroke-width="2" rx="8"/>
    <text x="540" y="495" font-size="14" font-weight="bold" text-anchor="middle" fill="#8e44ad">Layer 4-8</text>
    <text x="540" y="515" font-size="12" text-anchor="middle" fill="#34495e">Relations syntaxiques</text>
    <text x="540" y="532" font-size="10" text-anchor="middle" fill="#7f8c8d">• Sujet-Verbe-Objet</text>
    <text x="540" y="547" font-size="10" text-anchor="middle" fill="#7f8c8d">• Dépendances</text>
    
    <!-- Arrow -->
    <path d="M 410 515 L 440 515" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowpurple)"/>
    
    <!-- Layer 3 (High level - Semantics) -->
    <rect x="680" y="475" width="180" height="80" fill="#bb8fce" stroke="#9b59b6" stroke-width="2" rx="8"/>
    <text x="770" y="495" font-size="14" font-weight="bold" text-anchor="middle" fill="#8e44ad">Layer 9-12</text>
    <text x="770" y="515" font-size="12" text-anchor="middle" fill="#34495e">Sémantique complexe</text>
    <text x="770" y="532" font-size="10" text-anchor="middle" fill="#7f8c8d">• Sens contextuel</text>
    <text x="770" y="547" font-size="10" text-anchor="middle" fill="#7f8c8d">• Relations abstraites</text>
    
    <!-- Arrow -->
    <path d="M 640 515 L 670 515" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowpurple)"/>
    
    <!-- Output -->
    <rect x="910" y="490" width="120" height="50" fill="#8e44ad" stroke="#6c3483" stroke-width="2" rx="8"/>
    <text x="970" y="512" font-size="13" font-weight="bold" text-anchor="middle" fill="white">OUTPUT</text>
    <text x="970" y="530" font-size="11" text-anchor="middle" fill="#ecf0f1">Embeddings</text>
    
    <!-- Arrow -->
    <path d="M 870 515 L 900 515" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowpurple)"/>
    
    <!-- Examples at bottom -->
    <g id="examples">
      <text x="100" y="600" font-size="13" font-weight="bold" fill="#8e44ad">Exemples de capture par niveau:</text>
      
      <!-- Low level -->
      <text x="120" y="630" font-size="12" fill="#34495e" font-weight="bold">Couches basses (1-3):</text>
      <text x="140" y="650" font-size="11" fill="#7f8c8d">• "chien" = NOUN</text>
      <text x="140" y="668" font-size="11" fill="#7f8c8d">• "mange" = VERB</text>
      <text x="140" y="686" font-size="11" fill="#7f8c8d">• Structure: DÉTERMINANT + NOM + VERBE</text>
      
      <!-- Mid level -->
      <text x="420" y="630" font-size="12" fill="#34495e" font-weight="bold">Couches moyennes (4-8):</text>
      <text x="440" y="650" font-size="11" fill="#7f8c8d">• "chien" fait l'action de "manger"</text>
      <text x="440" y="668" font-size="11" fill="#7f8c8d">• Relation sujet-verbe établie</text>
      <text x="440" y="686" font-size="11" fill="#7f8c8d">• Détection de l'agent de l'action</text>
      
      <!-- High level -->
      <text x="750" y="630" font-size="12" fill="#34495e" font-weight="bold">Couches hautes (9-12):</text>
      <text x="770" y="650" font-size="11" fill="#7f8c8d">• Contexte: action de se nourrir</text>
      <text x="770" y="668" font-size="11" fill="#7f8c8d">• Sémantique: "manger" diffère selon sujet</text>
      <text x="770" y="686" font-size="11" fill="#7f8c8d">• Concept abstrait: comportement animal</text>
    </g>
    
    <defs>
      <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#9b59b6"/>
      </marker>
    </defs>
  </g>
</svg>