<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Part-of-Speech (POS) Tagging
  </text>
  <text x="450" y="55" font-family="Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#7f8c8d">
    Shakespearean-style Example
  </text>
  
  <!-- Input Sentence Box -->
  <rect x="50" y="80" width="800" height="60" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
    Input Sentence:
  </text>
  <text x="450" y="125" font-family="Georgia, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#2c3e50">
    "The merry fairies dance beneath the moonlit forest"
  </text>
  
  <!-- Arrow pointing down -->
  <path d="M 450 140 L 450 180" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="470" y="165" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#7f8c8d">
    POS Analysis
  </text>
  
  <!-- POS Tagged Display -->
  <rect x="50" y="190" width="800" height="280" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
    Tagged Output:
  </text>
  
  <!-- Individual word boxes with POS tags -->
  <g transform="translate(110, 250)">
    <!-- The -->
    <rect x="0" y="0" width="80" height="80" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="40" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">The</text>
    <text x="40" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">DET</text>
    
    <!-- merry -->
    <rect x="100" y="0" width="80" height="80" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="140" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">merry</text>
    <text x="140" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">ADJ</text>
    
    <!-- fairies -->
    <rect x="200" y="0" width="80" height="80" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="240" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">fairies</text>
    <text x="240" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">NOUN</text>
    
    <!-- dance -->
    <rect x="300" y="0" width="80" height="80" rx="5" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <text x="340" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">dance</text>
    <text x="340" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">VERB</text>
    
    <!-- beneath -->
    <rect x="400" y="0" width="80" height="80" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="440" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">beneath</text>
    <text x="440" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">PREP</text>
    
    <!-- the -->
    <rect x="500" y="0" width="80" height="80" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="540" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">the</text>
    <text x="540" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">DET</text>
    
    <!-- moonlit -->
    <rect x="600" y="0" width="80" height="80" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="640" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">moonlit</text>
    <text x="640" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">ADJ</text>
  </g>
  
  <g transform="translate(210, 350)">
    <!-- forest -->
    <rect x="0" y="0" width="80" height="80" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="40" y="35" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="white">forest</text>
    <text x="40" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ecf0f1">NOUN</text>
  </g>
  
  <!-- Legend -->
  <rect x="50" y="490" width="800" height="80" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
    POS Tags Legend:
  </text>
  
  <g transform="translate(60, 525)">
    <rect x="0" y="0" width="50" height="25" rx="3" fill="#3498db"/>
    <text x="25" y="17" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">DET</text>
    <text x="60" y="17" font-family="Arial, sans-serif" font-size="11" fill="#495057">Determiner</text>
    
    <rect x="140" y="0" width="50" height="25" rx="3" fill="#e74c3c"/>
    <text x="165" y="17" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">ADJ</text>
    <text x="200" y="17" font-family="Arial, sans-serif" font-size="11" fill="#495057">Adjective</text>
    
    <rect x="270" y="0" width="50" height="25" rx="3" fill="#9b59b6"/>
    <text x="295" y="17" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">NOUN</text>
    <text x="330" y="17" font-family="Arial, sans-serif" font-size="11" fill="#495057">Noun</text>
    
    <rect x="390" y="0" width="50" height="25" rx="3" fill="#2ecc71"/>
    <text x="415" y="17" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">VERB</text>
    <text x="450" y="17" font-family="Arial, sans-serif" font-size="11" fill="#495057">Verb</text>
    
    <rect x="500" y="0" width="50" height="25" rx="3" fill="#f39c12"/>
    <text x="525" y="17" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">PREP</text>
    <text x="560" y="17" font-family="Arial, sans-serif" font-size="11" fill="#495057">Preposition</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#34495e"/>
    </marker>
  </defs>
</svg>